# Dependabot configuration for NEAT-AI-Examples
#
# Keeps GitHub Actions pinned to commit SHAs automatically updated.
# Dependabot checks for new releases weekly and opens PRs to bump the
# SHA comment (e.g. `# v4.3.1`) while keeping the pin secure.

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
