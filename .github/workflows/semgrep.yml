# Semgrep SAST Scanning workflow for NEAT-AI-Examples
#
# Performs Static Application Security Testing (SAST) on every pull
# request. Runs the Semgrep CLI inside the official semgrep/semgrep
# container image against the default community ruleset (p/default).
#
# The SEMGREP_APP_TOKEN secret is optional: when set, results are
# uploaded to Semgrep AppSec Platform; when unset, the scan still runs
# locally and fails the job if any findings are reported.
#
# Actions are pinned to 40-character commit SHAs (not floating tags)
# in line with the project's supply-chain hardening rules.

name: Semgrep

# `branches: ["**"]` (not `["*"]`) so PRs against base branches that
# contain a `/` (e.g. `milestone/refresh-2026-05`) still trigger this
# workflow. The single-`*` glob does NOT match `/` — Issue #435.
on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      pr_head_ref:
        description: PR head branch to check out after an auto-bump push
        required: true
        type: string

permissions:
  contents: read

jobs:
  semgrep:
    name: SAST scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # semgrep/semgrep:latest — pinned to an immutable digest (Issue #555).
      # Bump deliberately, the same way the action SHA pins are maintained:
      #   docker buildx imagetools inspect semgrep/semgrep:latest
      image: semgrep/semgrep@sha256:7cad2bc2d1e44f87f0bf4be6d1fa23aa90fb72015bebc89fb91385d813987a03
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.pr_head_ref || github.ref }}

      - name: Run Semgrep
        run: semgrep ci --config p/default
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
