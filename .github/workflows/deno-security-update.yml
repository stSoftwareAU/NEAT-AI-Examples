# Advisory-driven security-update channel for NEAT-AI-Examples (Issue #601)
#
# The repo already has two pieces of supply-chain machinery, but a gap
# sits between them:
#
#   * `deno-outdated.yml` bumps pins — but only `on: pull_request` and
#     behind the routine 24h supply-chain quarantine (#441). It is the
#     freshness channel; by design it has no cron (#364), so a CVE
#     disclosed against an already-pinned dependency triggers nothing
#     until an unrelated PR happens to touch dependencies.
#   * `deno-audit.yml` (#572) *detects* a newly-disclosed advisory on a
#     weekly schedule — but it only fails the build. It never raises the
#     patch.
#
# This workflow is the missing security-UPDATE channel. It runs `deno
# audit` on a schedule and, when an advisory is found in the locked tree,
# fast-tracks a patch via the existing `bump-deps.sh` updater with the
# quarantine window set to 0h — security fixes bypass the routine 24h
# hold because a disclosed advisory means the *current* pin is the risk.
# The patch is pushed to a fresh branch and a PR is opened, so the fix
# lands out-of-band, independently of the PR-time bumper.
#
# It complements — does not replace — the other two channels:
#   detect (deno-audit) → patch (this) → routine freshness (deno-outdated)
#
# Actions are pinned to 40-character commit SHAs (not floating tags) in
# line with the project's supply-chain hardening rules (AGENTS.md).

name: Deno Security Update

on:
  schedule:
    # Daily, 04:00 UTC. More frequent than the weekly audit detector so a
    # disclosed advisory is patched out-of-band within a day, not a week.
    - cron: "0 4 * * *"
  workflow_dispatch:

# Never cancel in progress: this job pushes a branch and opens a PR, and
# interrupting it mid-commit could leave a half-written branch behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege (#679): `GITHUB_TOKEN` only reads here — the checkout
# fetch. The advisory branch is pushed with the `ACTIONS_PUSH` PAT and the
# PR is opened with `GH_TOKEN: secrets.ACTIONS_PUSH` (#651), so neither
# `contents: write` nor `pull-requests: write` is ever exercised.
permissions:
  contents: read

jobs:
  security-update:
    name: Fast-track advisory-driven dependency patches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Security fixes bypass the routine 24h quarantine (#441): a
      # disclosed advisory means the currently-pinned version is the
      # risk, so the patch is fast-tracked with a 0h window (#601).
      # Pinned here so the fast-track policy is auditable from CI config.
      VIBE_BUMP_QUARANTINE_HOURS: "0"
    steps:
      - name: Check out Develop
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: Develop
          # Do not persist a credential in `.git/config` (#678). This job
          # only runs trusted `Develop` code, so it is the secondary
          # call-site, but it keeps the same shape as deno-outdated: the
          # PAT is scoped to the push step alone.
          persist-credentials: false

      # Deno runtime only — this job runs `deno audit` / `bump-deps.sh`
      # (which does its own `deno install`), so it needs neither the
      # dependency cache nor a frozen install; install-deps stays false
      # (the default). Shared local composite action (Issue #682).
      - name: Set up Deno environment
        uses: ./.github/actions/setup-deno-env

      - name: Detect security advisories
        id: audit
        run: |
          set -euo pipefail
          # `--frozen` scans the committed lockfile without rewriting it,
          # so detection reflects exactly what is pinned today. A known
          # advisory in any pinned package makes `deno audit` exit
          # non-zero — that is the gate that arms the patch step below.
          if deno audit --frozen; then
            echo "No advisories in the locked tree — nothing to fast-track."
            echo "advisory=false" >> "$GITHUB_OUTPUT"
          else
            echo "Advisory detected — fast-tracking a security bump."
            echo "advisory=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fast-track the security patch
        id: bump
        if: steps.audit.outputs.advisory == 'true'
        run: |
          set -euo pipefail
          # bump-deps.sh reads VIBE_BUMP_QUARANTINE_HOURS=0 from the job
          # env, so the patched version is pulled even if it is younger
          # than the routine 24h quarantine window.
          bash bump-deps.sh
          if git diff --quiet deno.json deno.lock; then
            # The advisory has no patched release that the updater can
            # reach yet (e.g. no fixed version published). Surface it via
            # the failing weekly audit rather than opening an empty PR.
            echo "No newer published version clears the advisory yet."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="security/deno-advisory-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add deno.json deno.lock
          git commit -m "fix(security): fast-track advisory-driven dependency patch (#601)"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # Separate, secret-bearing step (#678): the PAT lives only in this
      # step's env, never in the checked-out workspace.
      - name: Push the advisory branch
        if: steps.bump.outputs.pushed == 'true'
        env:
          # A PAT push is a write-access event, so the daily security PR's
          # checks run automatically instead of stalling (#651).
          ACTIONS_PUSH: ${{ secrets.ACTIONS_PUSH }}
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          set -euo pipefail
          git config --unset-all core.hooksPath || true
          rm -rf .git/hooks
          git push \
            "https://x-access-token:${ACTIONS_PUSH}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${BRANCH}"

      - name: Open security-update PR
        if: steps.bump.outputs.pushed == 'true'
        env:
          # Open the PR with the ACTIONS_PUSH PAT so its checks trigger
          # automatically — a GITHUB_TOKEN-opened PR does not (#651).
          GH_TOKEN: ${{ secrets.ACTIONS_PUSH }}
        run: |
          set -euo pipefail
          gh pr create \
            --base Develop \
            --head "${{ steps.bump.outputs.branch }}" \
            --title "fix(security): advisory-driven dependency patch (#601)" \
            --body "Automated out-of-band security update. \`deno audit\` reported an advisory against a pinned dependency, so \`bump-deps.sh\` was run with \`VIBE_BUMP_QUARANTINE_HOURS=0\` to fast-track the patch past the routine 24h quarantine (#441). Review the \`deno.json\` / \`deno.lock\` diff and the audit output before merging. Closes the advisory raised by the scheduled \`Deno Audit\` workflow (#572)."
