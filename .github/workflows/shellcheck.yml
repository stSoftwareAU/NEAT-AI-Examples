# ShellCheck Lint workflow for NEAT-AI-Examples
#
# Lints every shell script in the repository on each pull request using
# ShellCheck. Catches common bugs and portability problems in Bash scripts
# (such as quality.sh and the per-example run.sh scripts) before they reach
# the default branch.
#
# Severity is set to `warning` so style-only suggestions do not fail the
# build but real warnings (and errors) do.
#
# Actions are pinned to 40-character commit SHAs (not floating tags)
# in line with the project's supply-chain hardening rules.

name: ShellCheck

# `branches: ["**"]` (not `["*"]`) so PRs against base branches that
# contain a `/` (e.g. `milestone/refresh-2026-05`) still trigger this
# workflow. The single-`*` glob does NOT match `/` — Issue #435.
on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      pr_head_ref:
        description: PR head branch to check out after an auto-bump push
        required: true
        type: string

# Cancel a superseded run as soon as a newer commit arrives on the same
# ref, so rapid pushes to a PR don't pile up duplicate runs (Issue #554).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.pr_head_ref || github.ref }}

      # Lints with koalaman/shellcheck (https://github.com/koalaman/shellcheck),
      # preinstalled on the ubuntu-latest runner. Issue #751 dropped the
      # `ludeeus/action-shellcheck` wrapper: it is dormant (no release since
      # 2023-01, no push since 2024-06), so its pinned SHA could never receive a
      # fix. Calling the binary directly removes the orphaned dependency rather
      # than swapping it for another wrapper, and the lint tracks the actively
      # maintained runner image's shellcheck version.
      #
      # Mirrors the retired configuration (`scandir: .`, `severity: warning`)
      # and fails loud (Issue #3234): a missing binary, an empty scan, or any
      # warning-and-above finding exits non-zero.
      - name: Run ShellCheck
        run: |
          set -euo pipefail
          shellcheck --version
          scripts=()
          while IFS= read -r -d '' script; do
            scripts+=("${script}")
          done < <(
            find . -name '*.sh' -type f \
              -not -path './.git/*' \
              -not -path './NEAT-AI-core/*' \
              -not -path './NEAT-AI-scorer/*' \
              -not -path '*/node_modules/*' \
              -print0
          )
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No shell scripts found to lint — the discovery pattern is broken" >&2
            exit 1
          fi
          printf 'Linting %d shell script(s)\n' "${#scripts[@]}"
          shellcheck --severity=warning "${scripts[@]}"

      # ShellCheck is a linter, not the bash parser — bash has no compile
      # step, so a syntax error can only be caught by parsing every
      # script. The committed gate script runs `bash -n` over the same
      # discovery set and fails the pull request on any script that does
      # not parse (Issue #768). The repository commits and owns its gate;
      # there is no shared cross-repo Action.
      - name: Run bash syntax gate
        run: ./quality/bash_syntax.sh
