# Gitleaks Secrets Detection workflow for NEAT-AI-Examples
#
# Scans pull requests for accidentally committed secrets such as API
# keys, tokens, and credentials. Runs against the full git history
# (fetch-depth: 0) so secrets introduced in earlier commits are caught.
#
# Uses the gitleaks CLI directly (open-source, no licence required)
# rather than gitleaks-action which requires a paid commercial licence.

name: Gitleaks

# `branches: ["**"]` (not `["*"]`) so PRs against base branches that
# contain a `/` (e.g. `milestone/refresh-2026-05`) still trigger this
# workflow. The single-`*` glob does NOT match `/` — Issue #435.
on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      pr_head_ref:
        description: PR head branch to check out after an auto-bump push
        required: true
        type: string

# Cancel a superseded run as soon as a newer commit arrives on the same
# ref, so rapid pushes to a PR don't pile up duplicate runs (Issue #554).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve PR base ref
        if: github.event_name == 'workflow_dispatch'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_REF: ${{ inputs.pr_head_ref }}
        run: |
          set -euo pipefail
          base_ref=$(
            gh pr list --head "${PR_HEAD_REF}" --json baseRefName \
              --jq '.[0].baseRefName'
          )
          if [ -z "${base_ref}" ] || [ "${base_ref}" = "null" ]; then
            echo "No open PR found for branch ${PR_HEAD_REF}"
            exit 1
          fi
          echo "base_ref=${base_ref}" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.pr_head_ref || github.ref }}
          fetch-depth: 0

      # Pin Gitleaks to an exact release AND to the SHA-256 of that
      # release's asset: a release asset is mutable, so the version alone
      # does not fix which bytes arrive (Issue #748). This job checks out
      # the full history, so a substituted binary would see every commit.
      # Bumps are manual — raise the version and the digest together
      # (take the digest from the upstream
      # `gitleaks_<version>_checksums.txt`), and allow the project
      # quarantine window (`VIBE_BUMP_QUARANTINE_HOURS`, default 24h) to
      # elapse after the new release before merging.
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          .github/scripts/install_verified_tool.sh \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "${GITLEAKS_SHA256}" \
            gitleaks

      - name: Run Gitleaks
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref || github.base_ref }}
        run: |
          set -euo pipefail
          ./gitleaks detect \
            --source . \
            --log-opts "origin/${BASE_REF}..HEAD" \
            --verbose
