# actionlint workflow for NEAT-AI-Examples (Issue #508)
#
# Lints every GitHub Actions workflow under `.github/workflows/` on each
# pull request. Catches typos, expression mistakes, shellcheck issues
# inside `run:` blocks, and unsafe patterns (e.g. unpinned actions,
# missing permissions) before they reach Develop and break a downstream
# CI run.
#
# The actionlint binary is downloaded directly from the rhysd/actionlint
# release tarball — same pattern used by `gitleaks.yml` — so the only
# third-party GitHub Action this workflow depends on is the official
# `actions/checkout`, which is pinned to a 40-character commit SHA in
# line with the project's supply-chain hardening rules.

name: Actionlint

# `branches: ["**"]` (not `["*"]`) so PRs against base branches that
# contain a `/` (e.g. `milestone/refresh-2026-05`) still trigger this
# workflow. The single-`*` glob does NOT match `/` — Issue #435.
#
# There is deliberately no `push:` trigger: this is a PR gate, so a push
# to `Develop` would only duplicate the run that already gated the pull
# request — wasted CI minutes, and a chance of a red tick on the default
# branch for a check that had already passed (Issue #807).
on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      pr_head_ref:
        description: PR head branch to check out after an auto-bump push
        required: true
        type: string

# Cancel a superseded run as soon as a newer commit arrives on the same
# ref, so rapid pushes to a PR don't pile up duplicate runs (Issue #554).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # `persist-credentials: false` keeps the workflow `GITHUB_TOKEN` out of
      # `.git/config`: this job only downloads actionlint and lints the
      # checked-out workflows, so it never pushes back and needs no private
      # submodule. Leaving the credential on disk would only let a later
      # compromised step read it back and act as the token (Issue #810).
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.pr_head_ref || github.ref }}
          persist-credentials: false

      # Pin actionlint to an exact release AND to the SHA-256 of that
      # release's asset: a release asset is mutable, so the version alone
      # does not fix which bytes arrive (Issue #748). The deno-outdated
      # bot does not bump non-Deno CI tools, so bumps here are manual —
      # raise the version and the digest together (take the digest from
      # the upstream `actionlint_<version>_checksums.txt`), and allow the
      # project quarantine window (`VIBE_BUMP_QUARANTINE_HOURS`, default
      # 24h) to elapse after the new release before merging.
      - name: Install actionlint
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION="1.7.12"
          ACTIONLINT_SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          .github/scripts/install_verified_tool.sh \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            "${ACTIONLINT_SHA256}" \
            actionlint

      - name: Run actionlint
        run: ./actionlint -color
