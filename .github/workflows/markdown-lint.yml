# Markdown Lint workflow for NEAT-AI-Examples
#
# Runs markdownlint-cli2 against every Markdown file in the repository
# on each pull request. Rule customisations live in
# `.markdownlint-cli2.jsonc` at the repository root.

name: Markdown Lint

# `branches: ["**"]` (not `["*"]`) so PRs against base branches that
# contain a `/` (e.g. `milestone/refresh-2026-05`) still trigger this
# workflow. The single-`*` glob does NOT match `/` — Issue #435.
#
# There is deliberately no `push:` trigger: this is a PR gate, so a push
# to `Develop` would only duplicate the run that already gated the pull
# request — wasted CI minutes, and a chance of a red tick on the default
# branch for a check that had already passed (Issue #808).
on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      pr_head_ref:
        description: PR head branch to check out after an auto-bump push
        required: true
        type: string

# Cancel a superseded run as soon as a newer commit arrives on the same
# ref, so rapid pushes to a PR don't pile up duplicate runs (Issue #554).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Issue #888 — skipped when the `changes` job finds nothing relevant: a pull
  # request that touches no Markdown (and not the lint config) has nothing new
  # to lint. A job skipped by `if:` reports success, so a required check never
  # hangs pending (a workflow-level `paths:` filter would). The skip needs a
  # positive `'false'` verdict: a failed or missing classification still runs
  # it.
  markdownlint:
    name: Lint Markdown
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.markdown_changed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # `persist-credentials: false` keeps the job's GITHUB_TOKEN out of
      # `.git/config` (Issue #814). This job only lints the checked-out
      # Markdown — it never pushes and fetches no private submodule — so a
      # persisted credential would only widen the blast radius of a
      # compromised step, such as the globally installed npm package below.
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.pr_head_ref || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "lts/*"

      # Issue #442 — pin markdownlint-cli2 to an exact version. Leaving
      # the name unpinned means each CI run resolves `latest` from npm,
      # which undoes the 40-char SHA pins on the surrounding actions: a
      # compromised package would execute on the next PR. The deno-
      # outdated bot does not bump npm-installed CI tools, so bumps here
      # are manual — when raising the pin, allow the project quarantine
      # window (`VIBE_BUMP_QUARANTINE_HOURS`, default 24h) to elapse
      # after the new release before merging.
      #
      # Issue #849 — `--ignore-scripts` completes that pin. The version
      # pin fixes which release of markdownlint-cli2 npm fetches, but by
      # default npm still runs any `preinstall` / `install` /
      # `postinstall` script declared by that package or by any of its
      # transitive dependencies, whose versions nothing here pins. Every
      # pull request runs this job, so a compromised dependency would
      # otherwise get arbitrary code execution on the runner. The flag is
      # passed here rather than via a repository `.npmrc` because hidden
      # files outside the project allowlist are not committed, and a flag
      # at the point of use is visible in the run log.
      - name: Install markdownlint-cli2
        run: npm install -g --ignore-scripts markdownlint-cli2@0.22.1

      - name: Run markdownlint-cli2
        run: markdownlint-cli2 "**/*.md" "#node_modules"

  # Classifies the pull request's changed paths for the gate above
  # (Issue #888). Checks out the default merge ref with `fetch-depth: 2`
  # so the merge commit's first parent is the base branch tip.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      markdown_changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Classify changed paths
        id: detect
        uses: ./.github/actions/detect-changes
        with:
          mode: markdown
