# Markdown Lint workflow for NEAT-AI-Examples
#
# Runs markdownlint-cli2 against every Markdown file in the repository
# on each pull request and push to the default branch. Rule
# customisations live in `.markdownlint-cli2.jsonc` at the repository
# root.
#
# The default branch in this repository is `Develop`; `main` and
# `master` are kept for portability with forks. Issue #435 — without
# `Develop` in the push branches list, the workflow never triggered
# automatically after a PR was merged into `Develop`.

name: Markdown Lint

# `branches: ["**"]` (not `["*"]`) so PRs against base branches that
# contain a `/` (e.g. `milestone/refresh-2026-05`) still trigger this
# workflow. The single-`*` glob does NOT match `/` — Issue #435.
on:
  pull_request:
    branches: ["**"]
  push:
    branches: [Develop]

permissions:
  contents: read

jobs:
  markdownlint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "lts/*"

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2

      - name: Run markdownlint-cli2
        run: markdownlint-cli2 "**/*.md" "#node_modules"
