# Deno Dependency Auto-Bump workflow for NEAT-AI-Examples (Issues #362, #364, #441)
#
# When a pull request is raised against `Develop`, this workflow runs
# `./bump-deps.sh`, which invokes the quarantine-aware updater
# (`bump_deps.ts`). External (non-`@stsoftware/*`) pins only bump to
# versions that are at least `VIBE_BUMP_QUARANTINE_HOURS` hours old —
# this is the supply-chain mitigation from #441. Internal
# `@stsoftware/*` packages bypass the gate and bump immediately.
#
# If pinned versions in `deno.json` lag the registry (and have cleared
# the quarantine for external packages), the changes are committed and
# pushed back to the PR head branch — so the PR ships with up-to-date
# dependencies automatically (#362).
#
# Pushes via GITHUB_TOKEN do not re-trigger other `pull_request`
# workflows. After a successful push this job dispatches the required
# checks via `workflow_dispatch` so branch protection still sees fresh
# results on the bumped HEAD (#485).
#
# There is deliberately no weekly cron: dependency refreshes only
# happen when a PR is raised, never as scheduled bot noise (#364).
#
# Forked PRs are skipped because GITHUB_TOKEN cannot push to a fork.

name: Deno Dependency Auto-Bump

on:
  pull_request:
    branches:
      - Develop

permissions:
  contents: write
  actions: write

jobs:
  auto-bump:
    name: Auto-bump Deno dependencies on PR
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      # Supply-chain quarantine window for external packages (#441).
      # Pinned in the workflow so the policy is auditable from CI config.
      VIBE_BUMP_QUARANTINE_HOURS: "24"
    steps:
      - name: Check out PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          # GITHUB_TOKEN pushes do not re-trigger other workflows; required
          # checks are re-dispatched explicitly after a bump push (#485).
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Bump and commit dependency updates
        id: bump
        run: |
          set -euo pipefail
          bash bump-deps.sh
          # Issue #418 — `deno.lock` is tracked; `bump-deps.sh` refreshes
          # it via `deno install`. Commit both files when either changes.
          if git diff --quiet deno.json deno.lock; then
            echo "All Deno dependencies already match \`deno update --latest\`."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Pinned versions lag the registry — committing the bump."
          git diff --stat deno.json deno.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deno.json deno.lock
          git commit -m "chore: auto-bump Deno dependencies (#362)"
          git push origin HEAD:"${GITHUB_HEAD_REF}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Re-dispatch required checks after bump push
        if: steps.bump.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for wf in \
            quality.yml \
            shellcheck.yml \
            markdown-lint.yml \
            semgrep.yml \
            gitleaks.yml \
            dependency-review.yml
          do
            echo "Dispatching ${wf} on ${GITHUB_HEAD_REF}"
            gh workflow run "${wf}" --ref "${GITHUB_HEAD_REF}" \
              -f pr_head_ref="${GITHUB_HEAD_REF}"
          done
