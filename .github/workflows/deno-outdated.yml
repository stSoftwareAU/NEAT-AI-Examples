# Deno Dependency Auto-Bump workflow for NEAT-AI-Examples (Issues #362, #364, #441)
#
# When a pull request is raised against `Develop`, this workflow runs
# `./bump-deps.sh`, which invokes the quarantine-aware updater
# (`bump_deps.ts`). External (non-`@stsoftware/*`) pins only bump to
# versions that are at least `VIBE_BUMP_QUARANTINE_HOURS` hours old —
# this is the supply-chain mitigation from #441. Internal
# `@stsoftware/*` packages bypass the gate and bump immediately.
#
# If pinned versions in `deno.json` lag the registry (and have cleared
# the quarantine for external packages), the changes are committed and
# pushed back to the PR head branch — so the PR ships with up-to-date
# dependencies automatically (#362).
#
# There is deliberately no weekly cron: dependency refreshes only
# happen when a PR is raised, never as scheduled bot noise (#364).
#
# Forked PRs are skipped because GITHUB_TOKEN cannot push to a fork.

name: Deno Dependency Auto-Bump

on:
  pull_request:
    branches:
      - Develop

permissions:
  contents: write

jobs:
  auto-bump:
    name: Auto-bump Deno dependencies on PR
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      # Supply-chain quarantine window for external packages (#441).
      # Pinned in the workflow so the policy is auditable from CI config.
      VIBE_BUMP_QUARANTINE_HOURS: "24"
    steps:
      - name: Check out PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          # Use GITHUB_TOKEN so the resulting push is attributed to the
          # workflow. Pushes via GITHUB_TOKEN do not re-trigger workflows
          # by design — no infinite loop.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Bump and commit dependency updates
        run: |
          set -euo pipefail
          bash bump-deps.sh
          # `deno.lock` is listed in `.gitignore` (local cache only); only
          # commit import-map pins in `deno.json`.
          if git diff --quiet deno.json; then
            echo "All Deno dependencies already match \`deno update --latest\`."
            exit 0
          fi
          echo "Pinned versions lag the registry — committing the bump."
          git diff --stat deno.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deno.json
          git commit -m "chore: auto-bump Deno dependencies (#362)"
          git push origin HEAD:"${GITHUB_HEAD_REF}"
