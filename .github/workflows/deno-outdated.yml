# Deno Dependency Auto-Bump workflow for NEAT-AI-Examples (Issues #362, #364, #441)
#
# When a pull request is raised against `Develop`, this workflow runs
# `./bump-deps.sh`, which invokes the quarantine-aware updater
# (`bump_deps.ts`). External (non-`@stsoftware/*`) pins only bump to
# versions that are at least `VIBE_BUMP_QUARANTINE_HOURS` hours old —
# this is the supply-chain mitigation from #441. Internal
# `@stsoftware/*` packages bypass the gate and bump immediately.
#
# If pinned versions in `deno.json` lag the registry (and have cleared
# the quarantine for external packages), the changes are committed and
# pushed back to the PR head branch — so the PR ships with up-to-date
# dependencies automatically (#362).
#
# The bump runs in `auto-bump` and the push in a separate `push-bump`
# job (#747). A fresh job gets a fresh runner environment, so nothing
# PR-authored `bump-deps.sh` appended to `$GITHUB_PATH` or `$GITHUB_ENV`
# is in scope when the org PAT is handed to the push — closing the last
# step-boundary-crossing primitive left after #678. The bumped manifests
# cross the boundary as an artefact.
#
# The bump commit is pushed with the org `ACTIONS_PUSH`
# PAT, not `GITHUB_TOKEN` (#651). A `GITHUB_TOKEN` push is attributed to
# `github-actions[bot]`, which has no write access, so GitHub held the
# resulting `pull_request` check runs in `action_required` state awaiting
# a maintainer's "Approve and run". A PAT push is a write-access event,
# so the `synchronize` runs of the required checks start automatically.
# This replaces the old #485 `workflow_dispatch` re-dispatch workaround,
# which was unreliable — Semgrep, Gitleaks and Dependency Review fail
# when dispatched outside PR context.
#
# There is deliberately no weekly cron: dependency refreshes only
# happen when a PR is raised, never as scheduled bot noise (#364).
#
# Forked PRs are skipped: the PAT is scoped to this repo and must not
# push to a fork, so external contributions still require approval.

name: Deno Dependency Auto-Bump

on:
  pull_request:
    branches:
      - Develop
  # Emergency fast-lane for an actively-exploited advisory: a maintainer can
  # dispatch this workflow manually and shorten (or zero out) the 24h
  # supply-chain quarantine window. The override is explicit and auditable —
  # the chosen value is recorded in the run inputs (Issue #603). See
  # SECURITY.md → "Emergency dependency-bump procedure".
  workflow_dispatch:
    inputs:
      quarantine_hours:
        description: "Quarantine window in hours. Set 0 only for a genuine active-exploitation emergency; leave at 24 otherwise."
        default: "24"
        type: string

# Serialise runs on the same ref but never cancel in progress: this job
# pushes auto-bump commits back to the PR head, and interrupting it
# mid-commit could leave the branch in a half-written state (Issue #554).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege (#679): `GITHUB_TOKEN` is only ever used to read — the
# checkout fetch. Every write rides the org `ACTIONS_PUSH` PAT by design
# (#651), so no write scope is granted. This matters here because the job
# executes PR-authored `bump-deps.sh`; an unused write grant would be
# capability handed to that script for zero functional benefit.
permissions:
  contents: read

jobs:
  auto-bump:
    name: Auto-bump Deno dependencies on PR
    # Run for same-repo PRs (forks cannot be pushed to) or for a manual
    # emergency dispatch (#603).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # Gate the secret-bearing push job on the bump having produced a
      # change worth pushing (#747).
      pushed: ${{ steps.bump.outputs.pushed }}
    env:
      # Supply-chain quarantine window for external packages (#441).
      # Defaults to 24h; a manual workflow_dispatch can override it for an
      # actively-exploited advisory, and the chosen value is auditable in
      # the run inputs (#603).
      VIBE_BUMP_QUARANTINE_HOURS: ${{ inputs.quarantine_hours || '24' }}
    steps:
      - name: Check out PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # On manual dispatch there is no PR head; fall back to the
          # dispatched ref/repository (#603).
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          # Do NOT persist a credential in `.git/config` (#678): this job
          # executes `bump-deps.sh` from the PR branch, and a persisted
          # PAT is one `git config --get
          # http.https://github.com/.extraheader` away from any PR author.
          # The org ACTIONS_PUSH PAT is supplied only to the push step
          # below, which runs after the PR-authored script has finished.
          persist-credentials: false

      # Deno runtime only — `bump-deps.sh` runs its own `deno install`, so
      # this job needs neither the dependency cache nor a frozen install;
      # install-deps stays false (the default). Shared local composite
      # action (Issue #682).
      - name: Set up Deno environment
        uses: ./.github/actions/setup-deno-env

      - name: Bump dependency updates
        id: bump
        run: |
          set -euo pipefail
          bash bump-deps.sh
          # Issue #418 — `deno.lock` is tracked; `bump-deps.sh` refreshes
          # it via `deno install`. Hand both files to the push job when
          # either changes.
          if git diff --quiet deno.json deno.lock; then
            echo "All Deno dependencies already match \`deno update --latest\`."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Pinned versions lag the registry — handing the bump to the push job."
          git diff --stat deno.json deno.lock
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # The bumped manifests cross the job boundary as data, not as a
      # runner environment: an artefact carries no `$GITHUB_PATH` /
      # `$GITHUB_ENV` mutation with it (#747).
      - name: Upload the bumped manifests
        if: steps.bump.outputs.pushed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deno-bump-manifests
          path: |
            deno.json
            deno.lock
          if-no-files-found: error
          retention-days: 1

  # Secret-bearing job (#747). It runs on a fresh runner, so nothing the
  # PR-authored `bump-deps.sh` appended to `$GITHUB_PATH` or `$GITHUB_ENV`
  # in `auto-bump` is in scope here — a planted `git` shim cannot execute
  # alongside the org PAT. This job checks the PR head out (files only)
  # and applies the bumped manifests from the artefact; it never executes
  # any pull-request-authored code.
  push-bump:
    name: Push the bump commit
    needs: auto-bump
    if: needs.auto-bump.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # On manual dispatch there is no PR head; fall back to the
          # dispatched ref/repository (#603).
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          # Keep the GITHUB_TOKEN out of `.git/config` (#678). The push
          # below authenticates with the PAT via an explicit remote URL.
          persist-credentials: false

      # Extracted into a scratch directory, never straight over the
      # workspace: the `auto-bump` job ran PR code, so treat the artefact
      # it produced as untrusted data and unpack it somewhere it cannot
      # reach `.git/`.
      - name: Download the bumped manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deno-bump-manifests
          path: .bump-artefact

      - name: Push the bump commit
        env:
          # Push as the org PAT so the bumped HEAD is a write-access event
          # and the required checks run automatically instead of stalling
          # in action_required (#651).
          ACTIONS_PUSH: ${{ secrets.ACTIONS_PUSH }}
        run: |
          set -euo pipefail
          # Copy exactly the two expected manifests out of the artefact.
          # An allowlist, not an overlay: nothing else the artefact may
          # contain can land in the workspace — least of all under `.git/`,
          # where a planted hook or `core.*` helper would execute during
          # the commit below with the PAT in env.
          cp .bump-artefact/deno.json deno.json
          cp .bump-artefact/deno.lock deno.lock
          rm -rf .bump-artefact
          # Belt and braces: no PR code has run on this runner, so no hook
          # can have been planted — but a fresh checkout is cheap to scrub.
          git config --unset-all core.hooksPath || true
          rm -rf .git/hooks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deno.json deno.lock
          git commit -m "chore: auto-bump Deno dependencies (#362)"
          # GITHUB_HEAD_REF is empty on workflow_dispatch; fall back to the
          # dispatched branch name (#603).
          git push \
            "https://x-access-token:${ACTIONS_PUSH}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:"${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
