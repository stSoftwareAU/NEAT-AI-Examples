# Deno Dependency Freshness workflow for NEAT-AI-Examples
#
# Runs `./bump-deps.sh` (which invokes `deno update --latest`) on pull
# requests so dependency drift is visible while work is in review. If
# pins would change, the step emits a CI warning and restores
# `deno.json` / `deno.lock` on the runner — it does not commit or open
# bot PRs. Run `./bump-deps.sh` locally, then `./quality.sh`, and commit
# when you want to refresh pins.

name: Deno Dependency Freshness

on:
  pull_request:
    branches:
      - Develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outdated:
    name: Check Deno dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Report dependency drift (non-blocking)
        run: |
          bash bump-deps.sh
          if git diff --quiet deno.json deno.lock; then
            echo "All tracked Deno dependencies already match \`deno update --latest\`."
          else
            echo "::warning::Pinned versions lag the registry. Run ./bump-deps.sh locally, then ./quality.sh, and commit deno.json and deno.lock."
            git diff --stat deno.json deno.lock
            git checkout -- deno.json deno.lock
          fi
