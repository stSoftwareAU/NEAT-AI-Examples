# Deno Dependency Freshness workflow for NEAT-AI-Examples
#
# Runs `deno outdated --latest` on pull requests so dependency drift is
# visible while work is in review. This workflow reports stale imports
# but does not modify the branch or open bot PRs.

name: Deno Dependency Freshness

on:
  pull_request:
    branches:
      - Develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outdated:
    name: Check Deno dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Check dependencies are current
        run: |
          deno outdated --latest > deno-outdated.txt
          if [[ -s deno-outdated.txt ]]; then
            echo "::error::Deno dependencies are outdated. Run 'deno outdated --update --latest' locally and commit the result."
            cat deno-outdated.txt
            exit 1
          fi
