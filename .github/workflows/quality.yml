# GitHub Actions CI/CD workflow for NEAT-AI-Examples
#
# Runs the project quality checks on every push to the Develop default
# branch and on every pull request, regardless of the base branch. This
# automates the quality gate to ensure all examples remain functional
# across contributions.
#
# The pull_request filter uses `branches: ["**"]` (not `["*"]`, which
# does NOT match `/`) so PRs against base branches that contain a `/`
# — notably milestone sub-issue branches named `milestone/<slug>` — still
# trigger the gate and report the required `Run quality checks` status.
# Without this, milestone PRs merged without the quality gate and hung on
# "Expected — waiting for status" (Issue #677), matching the widening the
# other PR-gating workflows already made under Issue #435.
#
# The single quality job was split into three independent parallel jobs
# (Issue #582) so the per-PR critical path is the slowest job, not the
# sum of every step:
#   - static-checks  — lint, fmt, type-check (Deno only)
#   - unit-tests     — full test suite + coverage, with the rust_scorer
#                      build (the only consumer of the
#                      NEAT_AI_RUST_SCORER_* env vars)
#   - examples       — Intelligent Design, Discovery (quick), Suggest (quick)
#   - coverage-upload — Codecov upload, split out of unit-tests (#747) so
#                      the CODECOV_TOKEN never shares a runner environment
#                      with the pull request's own test suite
#
# Only the unit-tests job builds rust_scorer; the examples job runs the
# JS path and needs Deno alone, so the ~2-minute Rust build is not
# duplicated.
#
# This workflow also generates a coverage report and uploads it to
# Codecov on pull requests. It is the sole quality workflow for the
# repository — the previous deno-quality.yml was a duplicate and was
# removed in issue #231.

name: Quality Check

on:
  push:
    branches:
      - Develop
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      pr_head_ref:
        description: PR head branch to check out after an auto-bump push
        required: true
        type: string

# Cancel a superseded run as soon as a newer commit arrives on the same
# ref, so rapid pushes to a PR (or to Develop) don't pile up duplicate
# runs — the expensive Rust build plus full Deno suite is the worst
# offender (Issue #554).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Static checks — lint, formatting, and type-checking. Deno only; no
  # Rust build or external repo checkouts needed.
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # `persist-credentials: false` keeps the job's GITHUB_TOKEN out of
      # `.git/config` (Issue #816). This job only runs `deno lint`,
      # `deno fmt --check` and `deno check` — it never pushes and fetches no
      # private submodule — so a persisted credential would only widen the
      # blast radius of a compromised step.
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.pr_head_ref || github.ref }}
          persist-credentials: false

      # Install Deno + cache deps + `deno install --frozen`, shared with
      # the other jobs and workflows via the local composite action
      # (Issue #682). Checkout must stay above: a local `./` action is
      # only resolvable after checkout.
      - name: Set up Deno environment
        uses: ./.github/actions/setup-deno-env
        with:
          install-deps: "true"

      - name: Run deno lint
        run: deno lint

      # Enforce formatting in CI with `deno fmt --check` so committed
      # formatting drift fails the pull request rather than being
      # silently reformatted in the ephemeral runner and never committed
      # back (Issue #663). Local `quality.sh` still applies the formatter
      # in write mode to fix drift before it is committed.
      - name: Check Deno formatting
        run: deno fmt --check

      - name: Run deno check (type checking)
        # `-- **/*.ts` so a filename starting with `-` (none today, but a
        # future addition would silently be parsed as a flag) cannot be
        # mistaken for an option. Flagged by actionlint/shellcheck SC2035
        # — the new actionlint CI gate (#508) enforces this going forward.
        run: deno check -- **/*.ts

  # Unit tests + coverage. This is the only job that builds rust_scorer
  # and sets the NEAT_AI_RUST_SCORER_* env vars, so the scorer/core
  # checkouts, sibling symlink, and Rust toolchain live here alone.
  unit-tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # persist-credentials: false — this job runs the PR's own test suite with
      # --allow-run=...,git, so a persisted GITHUB_TOKEN in .git/config would be
      # readable by any test. Nothing here pushes back (Issue #817).
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.pr_head_ref || github.ref }}
          persist-credentials: false

      # Shared Deno setup (install + cache + frozen install) via the local
      # composite action (Issue #682).
      - name: Set up Deno environment
        uses: ./.github/actions/setup-deno-env
        with:
          install-deps: "true"

      # persist-credentials: false — the checkout only needs the token for the
      # clone itself. Nothing later pushes to NEAT-AI-scorer or fetches a
      # private submodule from it, and the job runs the PR's own test suite with
      # --allow-run=...,git, so leaving the token in NEAT-AI-scorer/.git/config
      # would only widen the blast radius (Issue #818).
      - name: Check out NEAT-AI-scorer for MNIST CATEGORICAL_ERROR tests
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: stSoftwareAU/NEAT-AI-scorer
          ref: Develop
          path: NEAT-AI-scorer
          persist-credentials: false

      # rust_scorer depends on neat-core via `../../NEAT-AI-core/neat-core`
      # (sibling of NEAT-AI-scorer). actions/checkout cannot write outside
      # $GITHUB_WORKSPACE, so clone in-workspace and symlink the sibling path
      # NEAT-AI-scorer's own CI uses (NEAT-AI-scorer Issue #18).
      #
      # persist-credentials: false — cargo only reads the checked-out sources.
      # Nothing pushes to NEAT-AI-core or fetches a private submodule from it,
      # and this job runs the pull request's own test suite with
      # --allow-run=...,git, so a token left in NEAT-AI-core/.git/config would
      # only widen the blast radius (Issue #819).
      - name: Check out NEAT-AI-core (path dependency for neat-core)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: stSoftwareAU/NEAT-AI-core
          ref: Develop
          path: NEAT-AI-core
          persist-credentials: false

      - name: Link NEAT-AI-core sibling path expected by Cargo
        run: |
          set -euo pipefail
          if [ ! -e "$GITHUB_WORKSPACE/../NEAT-AI-core" ]; then
            ln -s "$GITHUB_WORKSPACE/NEAT-AI-core" "$GITHUB_WORKSPACE/../NEAT-AI-core"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      # Cache the cargo registry, git index, and rust_scorer build
      # artefacts so warm-cache runs skip most of the ~2-minute release
      # build (Issue #583). Uses actions/cache for consistency with the
      # Deno cache step above. NEAT-AI-scorer and NEAT-AI-core are checked
      # out at their moving Develop refs, so hashing Cargo.lock alone can
      # go stale against source changes — the restore-keys prefix lets a
      # slightly stale cache seed an incremental rebuild, which is still
      # far cheaper than a cold build. RUSTFLAGS="-D warnings" behaviour is
      # unchanged because cargo still recompiles anything whose source
      # changed.
      - name: Cache cargo registry and rust_scorer build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            NEAT-AI-scorer/target
          key: rust-scorer-${{ runner.os }}-${{ hashFiles('NEAT-AI-scorer/Cargo.lock') }}
          restore-keys: |
            rust-scorer-${{ runner.os }}-

      - name: Build rust_scorer
        run: RUSTFLAGS="-D warnings" cargo build --release -p rust_scorer
        working-directory: NEAT-AI-scorer

      # Tests need --allow-net so the @stsoftware/neat-ai WASM
      # activation module can fetch its remote payload from jsr.io,
      # and --allow-ffi so the optional native discovery library can
      # load when present. Issue #73.
      #
      # --coverage produces a profile that is converted to lcov and
      # uploaded to Codecov below. Issue #51.
      # GitHub-hosted runners are CPU-only (no GPU). MNIST evolveDir tests
      # pass timeoutMinutes: 0 and discoverySampleRate: -1 so Discovery is
      # never scheduled; only the CPU rust_scorer batch path is exercised.
      - name: Run unit tests with coverage
        env:
          NEAT_AI_RUST_SCORER_ENABLED: "true"
          NEAT_AI_RUST_SCORER_BINARY_PATH: ${{ github.workspace }}/NEAT-AI-scorer/target/release/rust_scorer
          NEAT_AI_RUST_SCORER_BATCH: "true"
        run: |
          set -euo pipefail
          # Probe the built rust_scorer for CATEGORICAL_ERROR support (#502).
          # If unsupported, the helper unsets NEAT_AI_RUST_SCORER_BINARY_PATH and
          # NEAT_AI_RUST_SCORER_ENABLED so the MNIST evolve tests fall back to JS.
          # shellcheck source=common/ensure_neat_ai_native_scorer.sh
          source "common/ensure_neat_ai_native_scorer.sh"
          ensure_rust_scorer_supports_cost CATEGORICAL_ERROR || true
          DENO_TEST_ALLOW_RUN="df,bash,git,deno"
          if [[ -n "${NEAT_AI_RUST_SCORER_BINARY_PATH:-}" ]]; then
            DENO_TEST_ALLOW_RUN="${DENO_TEST_ALLOW_RUN},${NEAT_AI_RUST_SCORER_BINARY_PATH}"
          fi
          DENO_TEST_FLAGS=(
            --frozen
            --v8-flags=--max-old-space-size=8192
            --no-check
            --allow-read
            --allow-write
            --allow-env
            --allow-net
            --allow-ffi
            --allow-run="${DENO_TEST_ALLOW_RUN}"
            --coverage=.coverage
          )
          # --ignore REPLACES deno.json's "exclude" for file discovery, so the
          # in-workspace NEAT-AI-scorer / NEAT-AI-core checkouts must be
          # repeated here or deno test walks into them and --frozen fails.
          # deno_config_exclude_test.ts enforces that this list stays in sync.
          deno test --parallel "${DENO_TEST_FLAGS[@]}" \
            --ignore=mnist_classification/evolve_integration_test.ts,mnist_classification/exploration_campaign_driver_test.ts,NEAT-AI-scorer,NEAT-AI-core,.coverage
          EVOLVE_INTEGRATION_FILTERS=(
            "evolveResultToMultiRunSample carries"
            "evolveMnistClassifier returns finite"
            "resume flow"
            "--fresh wipes"
            "rejects --target-error"
            "DEFAULT_MULTI_RUN_TARGET_ERROR"
            "--timeout override"
          )
          for filter in "${EVOLVE_INTEGRATION_FILTERS[@]}"; do
            deno test "${DENO_TEST_FLAGS[@]}" \
              mnist_classification/evolve_integration_test.ts \
              --filter "${filter}"
          done
          EXPLORATION_CAMPAIGN_FILTERS=(
            "records one phase per schedule entry"
            "resumes from the persisted champion"
            "rejects when there is no saved champion"
            "round-trips a persisted calibration record"
            "derives a four-rung ladder"
          )
          for filter in "${EXPLORATION_CAMPAIGN_FILTERS[@]}"; do
            deno test "${DENO_TEST_FLAGS[@]}" \
              mnist_classification/exploration_campaign_driver_test.ts \
              --filter "${filter}"
          done

      - name: Generate lcov coverage report
        run: deno coverage .coverage --lcov --output=.coverage/coverage.lcov

      # The report crosses to the Codecov job as data. An artefact carries
      # no `$GITHUB_PATH` / `$GITHUB_ENV` mutation with it, so the PR's own
      # test suite cannot reach the upload's token (#747).
      - name: Upload the lcov report as an artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: .coverage/coverage.lcov
          if-no-files-found: error
          retention-days: 1

  # Codecov upload — split out of unit-tests (#747). The PR's own test
  # suite runs with --allow-write/--allow-env/--allow-run, so sharing a
  # job with CODECOV_TOKEN let it prepend a `node` shim to `$GITHUB_PATH`
  # that the `node20` codecov-action would then execute with the token in
  # its environment. A fresh runner has neither the shim nor the PATH
  # mutation. The upload is deliberately NOT part of the aggregate gate:
  # fail_ci_if_error stays false so a Codecov outage cannot block a PR.
  coverage-upload:
    name: Upload coverage to Codecov
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit-tests

    steps:
      # Checked out for file paths only — no step in this job executes any
      # pull-request-authored code.
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.pr_head_ref || github.ref }}
          persist-credentials: false

      - name: Download the lcov report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-lcov
          path: .coverage

      # The codecov-action is a no-op when no coverage file is found,
      # and we set fail_ci_if_error: false so a transient Codecov
      # outage does not block the PR.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: .coverage/coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Examples — run the JS path of each demo. No Rust build: these run the
  # JS scorer and need Deno only.
  examples:
    name: Examples
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # `persist-credentials: false` keeps the job's GITHUB_TOKEN out of
      # `.git/config` (Issue #815). This job only runs the demo scripts — it
      # never pushes and fetches no private submodule — so a persisted
      # credential would only widen the blast radius of a compromised step.
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.pr_head_ref || github.ref }}
          persist-credentials: false

      # Shared Deno setup (install + cache + frozen install) via the local
      # composite action (Issue #682).
      - name: Set up Deno environment
        uses: ./.github/actions/setup-deno-env
        with:
          install-deps: "true"

      - name: Run Intelligent Design example
        run: ./intelligent_design/run.sh

      - name: Run Discovery example
        # The Discovery example requires a native Rust FFI library
        # (libneat_ai_discovery) which is not available in CI.
        # Allow this step to fail gracefully until the library
        # is available as a CI artefact. DISCOVERY_QUICK forces a tiny
        # budget (matching quality.sh, issue #375) so the step stops
        # burning its full 15-minute Discovery budget in CI (issue #581).
        continue-on-error: true
        env:
          DISCOVERY_QUICK: "1"
        run: ./discovery/run.sh

      - name: Run Suggest Improvements example
        # SUGGEST_QUICK forces a tiny budget (matching quality.sh,
        # issue #388) so this blocking step finishes quickly in CI
        # (issue #581).
        env:
          SUGGEST_QUICK: "1"
        run: ./suggest_improvements/run.sh

  # Aggregate gate. Branch protection on Develop requires a status check
  # named "Run quality checks" — the name of the former single job. The
  # split (PR #585) renamed that job into three, so the required context
  # stopped reporting and PRs hung on "Expected — waiting for status".
  # Keep a job with that exact name that depends on the three real jobs,
  # so the required check still reports. `if: always()` ensures it runs
  # (and therefore reports) even when a dependency fails, and it fails
  # the gate unless all three succeeded.
  quality:
    name: Run quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [static-checks, unit-tests, examples]
    if: ${{ always() }}
    steps:
      - name: Verify all quality jobs passed
        env:
          STATIC_CHECKS_RESULT: ${{ needs.static-checks.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          EXAMPLES_RESULT: ${{ needs.examples.result }}
        run: |
          set -euo pipefail
          echo "static-checks: ${STATIC_CHECKS_RESULT}"
          echo "unit-tests:    ${UNIT_TESTS_RESULT}"
          echo "examples:      ${EXAMPLES_RESULT}"
          if [ "${STATIC_CHECKS_RESULT}" != "success" ] || \
             [ "${UNIT_TESTS_RESULT}" != "success" ] || \
             [ "${EXAMPLES_RESULT}" != "success" ]; then
            echo "One or more quality jobs did not succeed" >&2
            exit 1
          fi
          echo "All quality jobs passed"
