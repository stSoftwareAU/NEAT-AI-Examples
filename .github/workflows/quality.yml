# GitHub Actions CI/CD workflow for NEAT-AI-Examples
#
# Runs the project quality checks on every push and pull request
# targeting the Develop branch. This automates the quality gate
# to ensure all examples remain functional across contributions.
#
# This workflow also generates a coverage report and uploads it to
# Codecov on pull requests. It is the sole quality workflow for the
# repository — the previous deno-quality.yml was a duplicate and was
# removed in issue #231.

name: Quality Check

on:
  push:
    branches:
      - Develop
  pull_request:
    branches:
      - Develop
  workflow_dispatch:
    inputs:
      pr_head_ref:
        description: PR head branch to check out after an auto-bump push
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    name: Run quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.pr_head_ref || github.ref }}

      - name: Install Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/deno
            ~/.deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.json', 'deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-

      # Verify the committed deno.lock matches deno.json before doing any
      # work. `--frozen` makes `deno install` fail (rather than silently
      # rewrite the lockfile) when the import map has drifted from the
      # lockfile, protecting CI from unconstrained transitive bumps
      # (issue #418).
      - name: Install dependencies with frozen lockfile
        run: deno install --frozen

      - name: Check out NEAT-AI-scorer for MNIST CATEGORICAL_ERROR tests
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: stSoftwareAU/NEAT-AI-scorer
          ref: Develop
          path: NEAT-AI-scorer

      # rust_scorer depends on neat-core via `../../NEAT-AI-core/neat-core`
      # (sibling of NEAT-AI-scorer). actions/checkout cannot write outside
      # $GITHUB_WORKSPACE, so clone in-workspace and symlink the sibling path
      # NEAT-AI-scorer's own CI uses (NEAT-AI-scorer Issue #18).
      - name: Check out NEAT-AI-core (path dependency for neat-core)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: stSoftwareAU/NEAT-AI-core
          ref: Develop
          path: NEAT-AI-core

      - name: Link NEAT-AI-core sibling path expected by Cargo
        run: |
          if [ ! -e "$GITHUB_WORKSPACE/../NEAT-AI-core" ]; then
            ln -s "$GITHUB_WORKSPACE/NEAT-AI-core" "$GITHUB_WORKSPACE/../NEAT-AI-core"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Build rust_scorer
        run: RUSTFLAGS="-D warnings" cargo build --release -p rust_scorer
        working-directory: NEAT-AI-scorer

      - name: Run deno lint
        run: deno lint

      # Apply formatter in CI (same as local `quality.sh`), rather than
      # `deno fmt --check`, so a formatting drift does not fail the job.
      - name: Apply Deno formatting
        run: deno fmt

      - name: Run deno check (type checking)
        # `-- **/*.ts` so a filename starting with `-` (none today, but a
        # future addition would silently be parsed as a flag) cannot be
        # mistaken for an option. Flagged by actionlint/shellcheck SC2035
        # — the new actionlint CI gate (#508) enforces this going forward.
        run: deno check -- **/*.ts

      # Tests need --allow-net so the @stsoftware/neat-ai WASM
      # activation module can fetch its remote payload from jsr.io,
      # and --allow-ffi so the optional native discovery library can
      # load when present. Issue #73.
      #
      # --coverage produces a profile that is converted to lcov and
      # uploaded to Codecov below. Issue #51.
      # GitHub-hosted runners are CPU-only (no GPU). MNIST evolveDir tests
      # pass timeoutMinutes: 0 and discoverySampleRate: -1 so Discovery is
      # never scheduled; only the CPU rust_scorer batch path is exercised.
      - name: Run unit tests with coverage
        env:
          NEAT_AI_RUST_SCORER_ENABLED: "true"
          NEAT_AI_RUST_SCORER_BINARY_PATH: ${{ github.workspace }}/NEAT-AI-scorer/target/release/rust_scorer
          NEAT_AI_RUST_SCORER_BATCH: "true"
        run: |
          set -euo pipefail
          # Probe the built rust_scorer for CATEGORICAL_ERROR support (#502).
          # If unsupported, the helper unsets NEAT_AI_RUST_SCORER_BINARY_PATH and
          # NEAT_AI_RUST_SCORER_ENABLED so the MNIST evolve tests fall back to JS.
          # shellcheck source=common/ensure_neat_ai_native_scorer.sh
          source "common/ensure_neat_ai_native_scorer.sh"
          ensure_rust_scorer_supports_cost CATEGORICAL_ERROR || true
          DENO_TEST_ALLOW_RUN="df,bash,git,deno"
          if [[ -n "${NEAT_AI_RUST_SCORER_BINARY_PATH:-}" ]]; then
            DENO_TEST_ALLOW_RUN="${DENO_TEST_ALLOW_RUN},${NEAT_AI_RUST_SCORER_BINARY_PATH}"
          fi
          DENO_TEST_FLAGS=(
            --frozen
            --v8-flags=--max-old-space-size=8192
            --no-check
            --allow-read
            --allow-write
            --allow-env
            --allow-net
            --allow-ffi
            --allow-run="${DENO_TEST_ALLOW_RUN}"
            --coverage=.coverage
          )
          deno test --parallel "${DENO_TEST_FLAGS[@]}" \
            --ignore=mnist_classification/evolve_integration_test.ts
          EVOLVE_INTEGRATION_FILTERS=(
            "evolveResultToMultiRunSample carries"
            "evolveMnistClassifier returns finite"
            "resume flow"
            "--fresh wipes"
            "rejects --target-error"
            "DEFAULT_MULTI_RUN_TARGET_ERROR"
            "--timeout override"
          )
          for filter in "${EVOLVE_INTEGRATION_FILTERS[@]}"; do
            deno test "${DENO_TEST_FLAGS[@]}" \
              mnist_classification/evolve_integration_test.ts \
              --filter "${filter}"
          done

      - name: Generate lcov coverage report
        run: deno coverage .coverage --lcov --output=.coverage/coverage.lcov

      # The codecov-action is a no-op when no coverage file is found,
      # and we set fail_ci_if_error: false so a transient Codecov
      # outage does not block the PR.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: .coverage/coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Run Intelligent Design example
        run: ./intelligent_design/run.sh

      - name: Run Discovery example
        # The Discovery example requires a native Rust FFI library
        # (libneat_ai_discovery) which is not available in CI.
        # Allow this step to fail gracefully until the library
        # is available as a CI artefact.
        continue-on-error: true
        run: ./discovery/run.sh

      - name: Run Suggest Improvements example
        run: ./suggest_improvements/run.sh
