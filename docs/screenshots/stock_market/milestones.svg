<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Stock Market — multi-run error vs cumulative generations chart">
  <title>Stock Market — multi-run error vs cumulative generations</title>
  <rect width="800" height="400" fill="#fafafa"/>
  <text x="400" y="24" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">Stock Market — multi-run error vs cumulative generations</text>
  <rect x="70" y="50" width="690" height="290" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <g class="x-axis" font-family="sans-serif" font-size="11" fill="#333333">
    <line x1="70" y1="340" x2="70" y2="344" stroke="#333333" stroke-width="1"/>
    <text x="70" y="358" text-anchor="middle">4805</text>
    <line x1="760" y1="340" x2="760" y2="344" stroke="#333333" stroke-width="1"/>
    <text x="760" y="358" text-anchor="middle">9077</text>
    <text x="415" y="376" text-anchor="middle" font-weight="bold">cumulative generation (log scale)</text>
  </g>
  <g class="y-axis" font-family="sans-serif" font-size="11" fill="#333333">
    <line x1="66" y1="340" x2="70" y2="340" stroke="#333333" stroke-width="1"/>
    <text x="62" y="340" text-anchor="end" dominant-baseline="middle">0</text>
    <line x1="66" y1="268.98" x2="70" y2="268.98" stroke="#333333" stroke-width="1"/>
    <text x="62" y="268.98" text-anchor="end" dominant-baseline="middle">0.05</text>
    <line x1="66" y1="197.96" x2="70" y2="197.96" stroke="#333333" stroke-width="1"/>
    <text x="62" y="197.96" text-anchor="end" dominant-baseline="middle">0.1</text>
    <line x1="66" y1="126.94" x2="70" y2="126.94" stroke="#333333" stroke-width="1"/>
    <text x="62" y="126.94" text-anchor="end" dominant-baseline="middle">0.15</text>
    <line x1="66" y1="55.91" x2="70" y2="55.91" stroke="#333333" stroke-width="1"/>
    <text x="62" y="55.91" text-anchor="end" dominant-baseline="middle">0.2</text>
    <line x1="66" y1="50" x2="70" y2="50" stroke="#333333" stroke-width="1"/>
    <text x="62" y="50" text-anchor="end" dominant-baseline="middle">0.204</text>
    <text x="22" y="195" text-anchor="middle" dominant-baseline="middle" font-weight="bold" transform="rotate(-90 22 195)">error</text>
  </g>
  <g class="axis-footnote" font-family="sans-serif" font-size="10" fill="#666666">
    <text x="415" y="386" text-anchor="middle">Linear error on Y · log₁₀ generations on X · one line segment per run (no cross-run spikes).</text>
  </g>
  <g class="run-boundaries" font-family="sans-serif" font-size="10" fill="#666666">
    <line class="run-boundary" x1="760" y1="50" x2="760" y2="340" stroke="#cccccc" stroke-width="0.5"/>
    <text x="760" y="46" text-anchor="middle">run 2</text>
  </g>
  <g class="error-line">
    <polyline fill="none" stroke="#d62728" stroke-width="1.5" points="70,50"/>
    <polyline fill="none" stroke="#d62728" stroke-width="1.5" points="760,73.11"/>
    <circle class="error-point" cx="70" cy="50" r="2.4" fill="#d62728"/>
    <circle class="error-point" cx="760" cy="73.11" r="2.4" fill="#d62728"/>
  </g>
  <g class="caption" font-family="sans-serif" font-size="12" fill="#222222">
    <text x="400" y="378" text-anchor="middle">final error 0.188 · 2 runs · 9077 cumulative generations · 1200158 ms total · 454 gen/min</text>
  </g>
</svg>
