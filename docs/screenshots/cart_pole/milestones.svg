<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 400"
  width="800"
  height="400"
  role="img"
  aria-label="Cart-Pole — multi-run error vs cumulative generations chart"
>
  <title>Cart-Pole — multi-run error vs cumulative generations</title>
  <rect width="800" height="400" fill="#fafafa" />
  <text
    x="400"
    y="24"
    text-anchor="middle"
    font-family="sans-serif"
    font-size="16"
    font-weight="bold"
    fill="#222"
  >Cart-Pole — multi-run error vs cumulative generations</text>
  <rect x="70" y="50" width="690" height="290" fill="#ffffff" stroke="#333333" stroke-width="1" />
  <g class="x-axis" font-family="sans-serif" font-size="11" fill="#333333">
    <line x1="70" y1="340" x2="70" y2="344" stroke="#333333" stroke-width="1" />
    <text x="70" y="358" text-anchor="middle">1</text>
    <line x1="242.5" y1="340" x2="242.5" y2="344" stroke="#333333" stroke-width="1" />
    <text x="242.5" y="358" text-anchor="middle">10</text>
    <line x1="415" y1="340" x2="415" y2="344" stroke="#333333" stroke-width="1" />
    <text x="415" y="358" text-anchor="middle">100</text>
    <line x1="587.5" y1="340" x2="587.5" y2="344" stroke="#333333" stroke-width="1" />
    <text x="587.5" y="358" text-anchor="middle">1000</text>
    <line x1="760" y1="340" x2="760" y2="344" stroke="#333333" stroke-width="1" />
    <text x="760" y="358" text-anchor="middle">10000</text>
    <text
      x="415"
      y="376"
      text-anchor="middle"
      font-weight="bold"
    >cumulative generation (log scale)</text>
  </g>
  <g class="y-axis" font-family="sans-serif" font-size="11" fill="#333333">
    <line x1="66" y1="340" x2="70" y2="340" stroke="#333333" stroke-width="1" />
    <text x="62" y="340" text-anchor="end" dominant-baseline="middle">0</text>
    <line x1="66" y1="272.08" x2="70" y2="272.08" stroke="#333333" stroke-width="1" />
    <text x="62" y="272.08" text-anchor="end" dominant-baseline="middle">0.2</text>
    <line x1="66" y1="204.17" x2="70" y2="204.17" stroke="#333333" stroke-width="1" />
    <text x="62" y="204.17" text-anchor="end" dominant-baseline="middle">0.4</text>
    <line x1="66" y1="136.25" x2="70" y2="136.25" stroke="#333333" stroke-width="1" />
    <text x="62" y="136.25" text-anchor="end" dominant-baseline="middle">0.6</text>
    <line x1="66" y1="68.34" x2="70" y2="68.34" stroke="#333333" stroke-width="1" />
    <text x="62" y="68.34" text-anchor="end" dominant-baseline="middle">0.8</text>
    <line x1="66" y1="50" x2="70" y2="50" stroke="#333333" stroke-width="1" />
    <text x="62" y="50" text-anchor="end" dominant-baseline="middle">0.854</text>
    <text
      x="22"
      y="195"
      text-anchor="middle"
      dominant-baseline="middle"
      font-weight="bold"
      transform="rotate(-90 22 195)"
    >error</text>
  </g>
  <g class="run-boundaries" font-family="sans-serif" font-size="10" fill="#666666"></g>
  <g class="error-line">
    <polyline
      fill="none"
      stroke="#d62728"
      stroke-width="1.5"
      points="70,50 121.93,55.91 190.57,55.91 242.5,55.91 294.43,55.91 363.07,59.24 415,59.24 466.93,59.24 535.57,120.29 587.5,130.89 760,147.46"
    />
    <circle class="error-point" cx="70" cy="50" r="2.4" fill="#d62728" />
    <circle class="error-point" cx="121.93" cy="55.91" r="2.4" fill="#d62728" />
    <circle class="error-point" cx="190.57" cy="55.91" r="2.4" fill="#d62728" />
    <circle class="error-point" cx="242.5" cy="55.91" r="2.4" fill="#d62728" />
    <circle class="error-point" cx="294.43" cy="55.91" r="2.4" fill="#d62728" />
    <circle class="error-point" cx="363.07" cy="59.24" r="2.4" fill="#d62728" />
    <circle class="error-point" cx="415" cy="59.24" r="2.4" fill="#d62728" />
    <circle class="error-point" cx="466.93" cy="59.24" r="2.4" fill="#d62728" />
    <circle class="error-point" cx="535.57" cy="120.29" r="2.4" fill="#d62728" />
    <circle class="error-point" cx="587.5" cy="130.89" r="2.4" fill="#d62728" />
    <circle class="error-point" cx="760" cy="147.46" r="2.4" fill="#d62728" />
  </g>
  <g class="caption" font-family="sans-serif" font-size="12" fill="#222222">
    <text
      x="400"
      y="394"
      text-anchor="middle"
    >final error 0.567 · 1 runs · 10000 cumulative generations · 132 ms total</text>
  </g>
</svg>
