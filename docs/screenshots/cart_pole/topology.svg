<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 320"
  width="720"
  height="320"
  role="img"
  aria-label="Cart Pole — neuron and synapse counts per generation"
>
  <title>Cart Pole — Topology Growth</title>
  <rect width="720" height="320" fill="#fafafa" />
  <text
    x="360"
    y="22"
    text-anchor="middle"
    font-family="sans-serif"
    font-size="14"
    font-weight="bold"
    fill="#222"
  >Cart Pole — Topology Growth</text>
  <text
    x="54.00"
    y="279.50"
    text-anchor="end"
    font-family="sans-serif"
    font-size="10"
    fill="#2ca02c"
  >0</text>
  <text
    x="54.00"
    y="219.50"
    text-anchor="end"
    font-family="sans-serif"
    font-size="10"
    fill="#2ca02c"
  >1</text>
  <text
    x="54.00"
    y="159.50"
    text-anchor="end"
    font-family="sans-serif"
    font-size="10"
    fill="#2ca02c"
  >3</text>
  <text
    x="54.00"
    y="99.50"
    text-anchor="end"
    font-family="sans-serif"
    font-size="10"
    fill="#2ca02c"
  >4</text>
  <text
    x="54.00"
    y="39.50"
    text-anchor="end"
    font-family="sans-serif"
    font-size="10"
    fill="#2ca02c"
  >5</text>
  <text
    x="656.00"
    y="279.50"
    text-anchor="start"
    font-family="sans-serif"
    font-size="10"
    fill="#d62728"
  >0</text>
  <text
    x="656.00"
    y="219.50"
    text-anchor="start"
    font-family="sans-serif"
    font-size="10"
    fill="#d62728"
  >1</text>
  <text
    x="656.00"
    y="159.50"
    text-anchor="start"
    font-family="sans-serif"
    font-size="10"
    fill="#d62728"
  >2</text>
  <text
    x="656.00"
    y="99.50"
    text-anchor="start"
    font-family="sans-serif"
    font-size="10"
    fill="#d62728"
  >3</text>
  <text
    x="656.00"
    y="39.50"
    text-anchor="start"
    font-family="sans-serif"
    font-size="10"
    fill="#d62728"
  >4</text>
  <polyline
    class="neuron-count"
    fill="none"
    stroke="#2ca02c"
    stroke-width="2"
    points="60.00,36.00 355.00,36.00 650.00,36.00"
  />
  <polyline
    class="synapse-count"
    fill="none"
    stroke="#d62728"
    stroke-width="2"
    stroke-dasharray="6 3"
    points="60.00,36.00 355.00,36.00 650.00,36.00"
  />
  <text x="60.00" y="304.00" font-family="sans-serif" font-size="11" fill="#333">gen 0</text>
  <text
    x="650.00"
    y="304.00"
    text-anchor="end"
    font-family="sans-serif"
    font-size="11"
    fill="#333"
  >gen 2</text>
  <g class="legend" font-family="sans-serif" font-size="11" fill="#222">
    <rect
      x="452.00"
      y="42.00"
      width="190"
      height="44"
      fill="#ffffff"
      fill-opacity="0.9"
      stroke="#cccccc"
    />
    <line x1="462.00" y1="54.00" x2="486.00" y2="54.00" stroke="#2ca02c" stroke-width="2" />
    <text x="492.00" y="57.00">neurons (left axis)</text>
    <line
      x1="462.00"
      y1="72.00"
      x2="486.00"
      y2="72.00"
      stroke="#d62728"
      stroke-width="2"
      stroke-dasharray="6 3"
    />
    <text x="492.00" y="75.00">synapses (right axis)</text>
  </g>
</svg>
