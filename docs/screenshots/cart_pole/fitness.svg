<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 400"
  width="800"
  height="400"
  role="img"
  aria-label="Cart-Pole — Fitness vs Generation dual-axis chart"
>
  <title>Cart-Pole — Fitness vs Generation</title>
  <rect width="800" height="400" fill="#fafafa" />
  <text
    x="400"
    y="24"
    text-anchor="middle"
    font-family="sans-serif"
    font-size="16"
    font-weight="bold"
    fill="#222"
  >Cart-Pole — Fitness vs Generation</text>
  <rect x="70" y="40" width="660" height="300" fill="#ffffff" stroke="#333333" stroke-width="1" />
  <g class="x-axis" font-family="sans-serif" font-size="11" fill="#333333">
    <line x1="70" y1="340" x2="70" y2="344" stroke="#333333" stroke-width="1" />
    <text x="70" y="358" text-anchor="middle">0</text>
    <line x1="400" y1="340" x2="400" y2="344" stroke="#333333" stroke-width="1" />
    <text x="400" y="358" text-anchor="middle">1</text>
    <line x1="730" y1="340" x2="730" y2="344" stroke="#333333" stroke-width="1" />
    <text x="730" y="358" text-anchor="middle">2</text>
    <text x="400" y="376" text-anchor="middle" font-weight="bold">generation</text>
  </g>
  <g class="left-axis" font-family="sans-serif" font-size="11" fill="#1f77b4">
    <line x1="66" y1="340" x2="70" y2="340" stroke="#1f77b4" stroke-width="1" />
    <text x="62" y="340" text-anchor="end" dominant-baseline="middle">377.6</text>
    <line x1="66" y1="282.64" x2="70" y2="282.64" stroke="#1f77b4" stroke-width="1" />
    <text x="62" y="282.64" text-anchor="end" dominant-baseline="middle">397.6</text>
    <line x1="66" y1="225.28" x2="70" y2="225.28" stroke="#1f77b4" stroke-width="1" />
    <text x="62" y="225.28" text-anchor="end" dominant-baseline="middle">417.6</text>
    <line x1="66" y1="167.92" x2="70" y2="167.92" stroke="#1f77b4" stroke-width="1" />
    <text x="62" y="167.92" text-anchor="end" dominant-baseline="middle">437.6</text>
    <line x1="66" y1="110.55" x2="70" y2="110.55" stroke="#1f77b4" stroke-width="1" />
    <text x="62" y="110.55" text-anchor="end" dominant-baseline="middle">457.6</text>
    <line x1="66" y1="53.19" x2="70" y2="53.19" stroke="#1f77b4" stroke-width="1" />
    <text x="62" y="53.19" text-anchor="end" dominant-baseline="middle">477.6</text>
    <line x1="66" y1="40" x2="70" y2="40" stroke="#1f77b4" stroke-width="1" />
    <text x="62" y="40" text-anchor="end" dominant-baseline="middle">482.2</text>
    <text
      x="22"
      y="190"
      text-anchor="middle"
      dominant-baseline="middle"
      font-weight="bold"
      transform="rotate(-90 22 190)"
    >best fitness</text>
  </g>
  <g class="right-axis" font-family="sans-serif" font-size="11" fill="#ff7f0e">
    <line x1="730" y1="340" x2="734" y2="340" stroke="#ff7f0e" stroke-width="1" />
    <text x="738" y="340" text-anchor="start" dominant-baseline="middle">75.544</text>
    <line x1="730" y1="256.56" x2="734" y2="256.56" stroke="#ff7f0e" stroke-width="1" />
    <text x="738" y="256.56" text-anchor="start" dominant-baseline="middle">125.544</text>
    <line x1="730" y1="173.12" x2="734" y2="173.12" stroke="#ff7f0e" stroke-width="1" />
    <text x="738" y="173.12" text-anchor="start" dominant-baseline="middle">175.544</text>
    <line x1="730" y1="89.69" x2="734" y2="89.69" stroke="#ff7f0e" stroke-width="1" />
    <text x="738" y="89.69" text-anchor="start" dominant-baseline="middle">225.544</text>
    <line x1="730" y1="40" x2="734" y2="40" stroke="#ff7f0e" stroke-width="1" />
    <text x="738" y="40" text-anchor="start" dominant-baseline="middle">255.318</text>
    <text
      x="778"
      y="190"
      text-anchor="middle"
      dominant-baseline="middle"
      font-weight="bold"
      transform="rotate(90 778 190)"
    >mean fitness</text>
  </g>
  <g class="best-line">
    <polyline fill="none" stroke="#1f77b4" stroke-width="1.5" points="70,130.92 400,340 730,40" />
    <circle class="best-point" cx="70" cy="130.92" r="1.8" fill="#1f77b4" />
    <circle class="best-point" cx="400" cy="340" r="1.8" fill="#1f77b4" />
    <circle class="best-point" cx="730" cy="40" r="1.8" fill="#1f77b4" />
  </g>
  <g class="avg-line">
    <polyline fill="none" stroke="#ff7f0e" stroke-width="1.5" points="70,40 400,340 730,328.61" />
    <circle class="avg-point" cx="70" cy="40" r="1.8" fill="#ff7f0e" />
    <circle class="avg-point" cx="400" cy="340" r="1.8" fill="#ff7f0e" />
    <circle class="avg-point" cx="730" cy="328.61" r="1.8" fill="#ff7f0e" />
  </g>
  <g class="legend" font-family="sans-serif" font-size="11" fill="#222222">
    <rect
      x="76"
      y="42"
      width="140"
      height="40"
      fill="#ffffff"
      fill-opacity="0.85"
      stroke="#cccccc"
      stroke-width="0.5"
    />
    <line x1="82" y1="52" x2="100" y2="52" stroke="#1f77b4" stroke-width="2" />
    <text x="106" y="56">best fitness</text>
    <line x1="82" y1="68" x2="100" y2="68" stroke="#ff7f0e" stroke-width="2" />
    <text x="106" y="72">mean fitness</text>
  </g>
  <g class="final-annotation" font-family="sans-serif" font-size="12" fill="#222222">
    <line
      x1="730"
      y1="40"
      x2="718"
      y2="52"
      stroke="#666666"
      stroke-width="0.8"
      stroke-dasharray="2,2"
    />
    <circle cx="730" cy="40" r="3.5" fill="#222222" />
    <text x="718" y="52" text-anchor="end">gen 2: best=482.2, avg=82.37</text>
  </g>
</svg>
