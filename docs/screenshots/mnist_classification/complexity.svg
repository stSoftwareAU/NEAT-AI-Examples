<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 400"
  width="800"
  height="400"
  role="img"
  aria-label="MNIST Classification — multi-run creature complexity dual-axis chart"
>
  <title>MNIST Classification — multi-run creature complexity</title>
  <rect width="800" height="400" fill="#fafafa" />
  <text
    x="400"
    y="24"
    text-anchor="middle"
    font-family="sans-serif"
    font-size="16"
    font-weight="bold"
    fill="#222"
  >MNIST Classification — multi-run creature complexity</text>
  <rect x="70" y="50" width="660" height="290" fill="#ffffff" stroke="#333333" stroke-width="1" />
  <g class="x-axis" font-family="sans-serif" font-size="11" fill="#333333">
    <line x1="400" y1="340" x2="400" y2="344" stroke="#333333" stroke-width="1" />
    <text x="400" y="358" text-anchor="middle">94</text>
    <text
      x="400"
      y="376"
      text-anchor="middle"
      font-weight="bold"
    >cumulative generation (log scale)</text>
  </g>
  <g class="left-axis" font-family="sans-serif" font-size="11" fill="#333333">
    <line x1="66" y1="340" x2="70" y2="340" stroke="#333333" stroke-width="1" />
    <text x="62" y="340" text-anchor="end" dominant-baseline="middle">0</text>
    <line x1="66" y1="281.93" x2="70" y2="281.93" stroke="#333333" stroke-width="1" />
    <text x="62" y="281.93" text-anchor="end" dominant-baseline="middle">159</text>
    <line x1="66" y1="223.85" x2="70" y2="223.85" stroke="#333333" stroke-width="1" />
    <text x="62" y="223.85" text-anchor="end" dominant-baseline="middle">318</text>
    <line x1="66" y1="165.78" x2="70" y2="165.78" stroke="#333333" stroke-width="1" />
    <text x="62" y="165.78" text-anchor="end" dominant-baseline="middle">477</text>
    <line x1="66" y1="107.71" x2="70" y2="107.71" stroke="#333333" stroke-width="1" />
    <text x="62" y="107.71" text-anchor="end" dominant-baseline="middle">636</text>
    <line x1="66" y1="50" x2="70" y2="50" stroke="#333333" stroke-width="1" />
    <text x="62" y="50" text-anchor="end" dominant-baseline="middle">794</text>
    <text
      x="22"
      y="195"
      text-anchor="middle"
      dominant-baseline="middle"
      font-weight="bold"
      transform="rotate(-90 22 195)"
    >neurons</text>
  </g>
  <g class="right-axis" font-family="sans-serif" font-size="11" fill="#333333">
    <line x1="730" y1="340" x2="734" y2="340" stroke="#333333" stroke-width="1" />
    <text x="738" y="340" text-anchor="start" dominant-baseline="middle">0</text>
    <line x1="730" y1="282.01" x2="734" y2="282.01" stroke="#333333" stroke-width="1" />
    <text x="738" y="282.01" text-anchor="start" dominant-baseline="middle">1568</text>
    <line x1="730" y1="224.01" x2="734" y2="224.01" stroke="#333333" stroke-width="1" />
    <text x="738" y="224.01" text-anchor="start" dominant-baseline="middle">3136</text>
    <line x1="730" y1="166.02" x2="734" y2="166.02" stroke="#333333" stroke-width="1" />
    <text x="738" y="166.02" text-anchor="start" dominant-baseline="middle">4704</text>
    <line x1="730" y1="108.03" x2="734" y2="108.03" stroke="#333333" stroke-width="1" />
    <text x="738" y="108.03" text-anchor="start" dominant-baseline="middle">6272</text>
    <line x1="730" y1="50.04" x2="734" y2="50.04" stroke="#333333" stroke-width="1" />
    <text x="738" y="50.04" text-anchor="start" dominant-baseline="middle">7840</text>
    <line x1="730" y1="50" x2="734" y2="50" stroke="#333333" stroke-width="1" />
    <text x="738" y="50" text-anchor="start" dominant-baseline="middle">7841</text>
    <text
      x="778"
      y="195"
      text-anchor="middle"
      dominant-baseline="middle"
      font-weight="bold"
      transform="rotate(90 778 195)"
    >synapses</text>
  </g>
  <g class="run-boundaries" font-family="sans-serif" font-size="10" fill="#666666"></g>
  <g class="neurons-line">
    <polyline fill="none" stroke="#2ca02c" stroke-width="1.5" points="400,50" />
    <circle class="neurons-point" cx="400" cy="50" r="2.4" fill="#2ca02c" />
  </g>
  <g class="synapses-line">
    <polyline fill="none" stroke="#d62728" stroke-width="1.5" points="400,50" />
    <circle class="synapses-point" cx="400" cy="50" r="2.4" fill="#d62728" />
  </g>
  <g class="legend" font-family="sans-serif" font-size="11" fill="#222222">
    <rect
      x="76"
      y="52"
      width="120"
      height="40"
      fill="#ffffff"
      fill-opacity="0.85"
      stroke="#cccccc"
      stroke-width="0.5"
    />
    <line x1="82" y1="62" x2="100" y2="62" stroke="#2ca02c" stroke-width="2" />
    <text x="106" y="66">neurons</text>
    <line x1="82" y1="78" x2="100" y2="78" stroke="#d62728" stroke-width="2" />
    <text x="106" y="82">synapses</text>
  </g>
  <g class="caption" font-family="sans-serif" font-size="12" fill="#222222">
    <text
      x="400"
      y="394"
      text-anchor="middle"
    >final 794 neurons · 7841 synapses · 1 runs · 94 cumulative generations</text>
  </g>
</svg>
