<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="MNIST Classification — multi-run creature complexity dual-axis chart">
  <title>MNIST Classification — multi-run creature complexity</title>
  <rect width="800" height="400" fill="#fafafa"/>
  <text x="400" y="24" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">MNIST Classification — multi-run creature complexity</text>
  <rect x="70" y="50" width="660" height="290" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <g class="x-axis" font-family="sans-serif" font-size="11" fill="#333333">
    <line x1="70" y1="340" x2="70" y2="344" stroke="#333333" stroke-width="1"/>
    <text x="70" y="358" text-anchor="middle">6</text>
    <line x1="556.4" y1="340" x2="556.4" y2="344" stroke="#333333" stroke-width="1"/>
    <text x="556.4" y="358" text-anchor="middle">10</text>
    <line x1="730" y1="340" x2="730" y2="344" stroke="#333333" stroke-width="1"/>
    <text x="730" y="358" text-anchor="middle">12</text>
    <text x="400" y="376" text-anchor="middle" font-weight="bold">cumulative generation (log scale)</text>
  </g>
  <g class="left-axis" font-family="sans-serif" font-size="11" fill="#333333">
    <line x1="66" y1="340" x2="70" y2="340" stroke="#333333" stroke-width="1"/>
    <text x="62" y="340" text-anchor="end" dominant-baseline="middle">0</text>
    <line x1="66" y1="281.94" x2="70" y2="281.94" stroke="#333333" stroke-width="1"/>
    <text x="62" y="281.94" text-anchor="end" dominant-baseline="middle">210</text>
    <line x1="66" y1="223.89" x2="70" y2="223.89" stroke="#333333" stroke-width="1"/>
    <text x="62" y="223.89" text-anchor="end" dominant-baseline="middle">420</text>
    <line x1="66" y1="165.83" x2="70" y2="165.83" stroke="#333333" stroke-width="1"/>
    <text x="62" y="165.83" text-anchor="end" dominant-baseline="middle">630</text>
    <line x1="66" y1="107.78" x2="70" y2="107.78" stroke="#333333" stroke-width="1"/>
    <text x="62" y="107.78" text-anchor="end" dominant-baseline="middle">840</text>
    <line x1="66" y1="50" x2="70" y2="50" stroke="#333333" stroke-width="1"/>
    <text x="62" y="50" text-anchor="end" dominant-baseline="middle">1049</text>
    <text x="22" y="195" text-anchor="middle" dominant-baseline="middle" font-weight="bold" transform="rotate(-90 22 195)">neurons</text>
  </g>
  <g class="right-axis" font-family="sans-serif" font-size="11" fill="#333333">
    <line x1="730" y1="340" x2="734" y2="340" stroke="#333333" stroke-width="1"/>
    <text x="738" y="340" text-anchor="start" dominant-baseline="middle">0</text>
    <line x1="730" y1="282" x2="734" y2="282" stroke="#333333" stroke-width="1"/>
    <text x="738" y="282" text-anchor="start" dominant-baseline="middle">40214</text>
    <line x1="730" y1="224" x2="734" y2="224" stroke="#333333" stroke-width="1"/>
    <text x="738" y="224" text-anchor="start" dominant-baseline="middle">80428</text>
    <line x1="730" y1="166" x2="734" y2="166" stroke="#333333" stroke-width="1"/>
    <text x="738" y="166" text-anchor="start" dominant-baseline="middle">120642</text>
    <line x1="730" y1="108" x2="734" y2="108" stroke="#333333" stroke-width="1"/>
    <text x="738" y="108" text-anchor="start" dominant-baseline="middle">160856</text>
    <line x1="730" y1="50" x2="734" y2="50" stroke="#333333" stroke-width="1"/>
    <text x="738" y="50" text-anchor="start" dominant-baseline="middle">201070</text>
    <line x1="730" y1="50" x2="734" y2="50" stroke="#333333" stroke-width="1"/>
    <text x="738" y="50" text-anchor="start" dominant-baseline="middle">201071</text>
    <text x="778" y="195" text-anchor="middle" dominant-baseline="middle" font-weight="bold" transform="rotate(90 778 195)">synapses</text>
  </g>
  <g class="run-boundaries" font-family="sans-serif" font-size="10" fill="#666666">
    <line class="run-boundary" x1="647.15" y1="50" x2="647.15" y2="340" stroke="#cccccc" stroke-width="0.5"/>
    <text x="647.15" y="46" text-anchor="middle">run 2</text>
    <line class="run-boundary" x1="730" y1="50" x2="730" y2="340" stroke="#cccccc" stroke-width="0.5"/>
    <text x="730" y="46" text-anchor="middle">run 3</text>
  </g>
  <g class="neurons-line">
    <polyline fill="none" stroke="#2ca02c" stroke-width="1.5" points="70,50"/>
    <polyline fill="none" stroke="#2ca02c" stroke-width="1.5" points="647.15,50.28"/>
    <polyline fill="none" stroke="#2ca02c" stroke-width="1.5" points="730,50.28"/>
    <circle class="neurons-point" cx="70" cy="50" r="2.4" fill="#2ca02c"/>
    <circle class="neurons-point" cx="647.15" cy="50.28" r="2.4" fill="#2ca02c"/>
    <circle class="neurons-point" cx="730" cy="50.28" r="2.4" fill="#2ca02c"/>
  </g>
  <g class="synapses-line">
    <polyline fill="none" stroke="#d62728" stroke-width="1.5" points="70,50"/>
    <polyline fill="none" stroke="#d62728" stroke-width="1.5" points="647.15,51.13"/>
    <polyline fill="none" stroke="#d62728" stroke-width="1.5" points="730,51.13"/>
    <circle class="synapses-point" cx="70" cy="50" r="2.4" fill="#d62728"/>
    <circle class="synapses-point" cx="647.15" cy="51.13" r="2.4" fill="#d62728"/>
    <circle class="synapses-point" cx="730" cy="51.13" r="2.4" fill="#d62728"/>
  </g>
  <g class="legend" font-family="sans-serif" font-size="11" fill="#222222">
    <rect x="76" y="52" width="120" height="40" fill="#ffffff" fill-opacity="0.85" stroke="#cccccc" stroke-width="0.5"/>
    <line x1="82" y1="62" x2="100" y2="62" stroke="#2ca02c" stroke-width="2"/>
    <text x="106" y="66">neurons</text>
    <line x1="82" y1="78" x2="100" y2="78" stroke="#d62728" stroke-width="2"/>
    <text x="106" y="82">synapses</text>
  </g>
  <g class="caption" font-family="sans-serif" font-size="12" fill="#222222">
    <text x="400" y="394" text-anchor="middle">final 1048 neurons · 200286 synapses · 3 runs · 12 cumulative generations</text>
  </g>
</svg>
