    <text x="615.44" y="82.00" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222">Summary</text>
    <text x="615.44" y="104.00" font-family="sans-serif" font-size="11" fill="#333">pre-prune  neurons = 7</text>
    <text x="615.44" y="120.00" font-family="sans-serif" font-size="11" fill="#333">post-prune neurons = 6</text>
    <text x="615.44" y="136.00" font-family="sans-serif" font-size="11" fill="#333">Δ neurons = 1</text>
    <text x="615.44" y="152.00" font-family="sans-serif" font-size="11" fill="#333">pre-prune  score = -0.069279</text>
    <text x="615.44" y="168.00" font-family="sans-serif" font-size="11" fill="#333">post-prune score = -0.069279</text>
    <text x="615.44" y="184.00" font-family="sans-serif" font-size="11" fill="#333">Δ score = 0.000000</text>
    <text x="615.44" y="214.00" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222">Pruned neurons (idx → bias-fold targets)</text>
    <text x="615.44" y="232.00" font-family="monospace" font-size="10.5" fill="#444">#4 (out=-0.648) → [6]</text>
  </g>
  <g class="legend" font-family="sans-serif" font-size="10" fill="#222">
    <rect x="36.00" y="464.00" width="540" height="62" fill="#ffffff" fill-opacity="0.92" stroke="#cccccc" stroke-width="0.5"/>
    <line x1="48.00" y1="480.00" x2="74.00" y2="480.00" stroke="#555" stroke-width="0.9"/>
    <text x="82.00" y="483.00">original synapse (kept)</text>
    <line x1="48.00" y1="496.00" x2="74.00" y2="496.00" stroke="#bdbdbd" stroke-width="0.9" stroke-dasharray="2 2"/>
    <text x="82.00" y="499.00">edge incident on pruned neuron (removed)</text>
    <line x1="48.00" y1="512.00" x2="74.00" y2="512.00" stroke="#e57373" stroke-width="1.4" marker-end="url(#bias-arrow)"/>
    <text x="82.00" y="515.00">bias-fold contribution to downstream neuron</text>
    <circle cx="316.00" cy="480.00" r="5" fill="#7fb069" stroke="#222" stroke-width="0.6"/>
    <text x="328.00" y="483.00">kept hidden neuron</text>
    <circle cx="316.00" cy="496.00" r="5" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="0.6" stroke-dasharray="2 2"/>
    <text x="328.00" y="499.00">pruned neuron (constant activation)</text>
    <circle cx="316.00" cy="512.00" r="5" fill="#4d82a3" stroke="#222" stroke-width="0.6"/>
    <text x="328.00" y="515.00">input</text>
    <circle cx="396.00" cy="512.00" r="5" fill="#d18b48" stroke="#222" stroke-width="0.6"/>
    <text x="408.00" y="515.00">output</text>
  </g>
