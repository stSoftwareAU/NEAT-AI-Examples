    <circle class="neurons-point" cx="136.23" cy="252.12" r="2.4" fill="#2ca02c" />
    <circle class="neurons-point" cx="223.77" cy="252.12" r="2.4" fill="#2ca02c" />
    <circle class="neurons-point" cx="290" cy="252.12" r="2.4" fill="#2ca02c" />
    <circle class="neurons-point" cx="356.23" cy="252.12" r="2.4" fill="#2ca02c" />
    <circle class="neurons-point" cx="443.77" cy="252.12" r="2.4" fill="#2ca02c" />
    <circle class="neurons-point" cx="510" cy="252.12" r="2.4" fill="#2ca02c" />
    <circle class="neurons-point" cx="576.23" cy="252.12" r="2.4" fill="#2ca02c" />
    <circle class="neurons-point" cx="663.77" cy="208.18" r="2.4" fill="#2ca02c" />
    <circle class="neurons-point" cx="730" cy="50" r="2.4" fill="#2ca02c" />
