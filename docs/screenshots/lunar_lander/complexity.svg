    />
    <circle class="synapses-point" cx="70" cy="220.59" r="2.4" fill="#d62728" />
    <circle class="synapses-point" cx="136.23" cy="220.59" r="2.4" fill="#d62728" />
    <circle class="synapses-point" cx="223.77" cy="220.59" r="2.4" fill="#d62728" />
    <circle class="synapses-point" cx="290" cy="220.59" r="2.4" fill="#d62728" />
    <circle class="synapses-point" cx="356.23" cy="220.59" r="2.4" fill="#d62728" />
    <circle class="synapses-point" cx="443.77" cy="226.27" r="2.4" fill="#d62728" />
    <circle class="synapses-point" cx="510" cy="226.27" r="2.4" fill="#d62728" />
    <circle class="synapses-point" cx="576.23" cy="226.27" r="2.4" fill="#d62728" />
    <circle class="synapses-point" cx="663.77" cy="243.33" r="2.4" fill="#d62728" />
    <circle class="synapses-point" cx="730" cy="50" r="2.4" fill="#d62728" />
