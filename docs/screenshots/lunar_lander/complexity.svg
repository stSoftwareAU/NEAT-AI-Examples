    <text x="738" y="340" text-anchor="start" dominant-baseline="middle">0</text>
    <line x1="730" y1="283.14" x2="734" y2="283.14" stroke="#333333" stroke-width="1" />
    <text x="738" y="283.14" text-anchor="start" dominant-baseline="middle">10</text>
    <line x1="730" y1="226.27" x2="734" y2="226.27" stroke="#333333" stroke-width="1" />
    <text x="738" y="226.27" text-anchor="start" dominant-baseline="middle">20</text>
    <line x1="730" y1="169.41" x2="734" y2="169.41" stroke="#333333" stroke-width="1" />
    <text x="738" y="169.41" text-anchor="start" dominant-baseline="middle">30</text>
    <line x1="730" y1="112.55" x2="734" y2="112.55" stroke="#333333" stroke-width="1" />
