  viewBox="0 0 800 400"
  width="800"
  height="400"
  role="img"
  aria-label="Lunar Lander — multi-run creature complexity dual-axis chart"
>
  <title>Lunar Lander — multi-run creature complexity</title>
  <rect width="800" height="400" fill="#fafafa" />
  <text
    x="400"
    y="24"
    text-anchor="middle"
    font-family="sans-serif"
    font-size="16"
    font-weight="bold"
    fill="#222"
