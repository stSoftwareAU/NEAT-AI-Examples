<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 400"
  width="800"
  height="400"
  role="img"
  aria-label="Maze Navigation — evolveRL Milestones dual-axis chart"
>
  <title>Maze Navigation — evolveRL Milestones</title>
  <rect width="800" height="400" fill="#fafafa" />
  <text
    x="400"
    y="24"
    text-anchor="middle"
    font-family="sans-serif"
    font-size="16"
    font-weight="bold"
    fill="#222"
  >Maze Navigation — evolveRL Milestones</text>
  <rect x="70" y="40" width="660" height="300" fill="#ffffff" stroke="#333333" stroke-width="1" />
  <g class="x-axis" font-family="sans-serif" font-size="11" fill="#333333">
    <line x1="70" y1="340" x2="70" y2="344" stroke="#333333" stroke-width="1" />
    <text x="70" y="358" text-anchor="middle">1</text>
    <line x1="400" y1="340" x2="400" y2="344" stroke="#333333" stroke-width="1" />
    <text x="400" y="358" text-anchor="middle">10</text>
    <line x1="730" y1="340" x2="730" y2="344" stroke="#333333" stroke-width="1" />
    <text x="730" y="358" text-anchor="middle">100</text>
    <text x="400" y="376" text-anchor="middle" font-weight="bold">generation (log scale)</text>
  </g>
  <g class="left-axis" font-family="sans-serif" font-size="11" fill="#333333">
    <line x1="66" y1="340" x2="70" y2="340" stroke="#333333" stroke-width="1" />
    <text x="62" y="340" text-anchor="end" dominant-baseline="middle">-1</text>
    <line x1="66" y1="265.37" x2="70" y2="265.37" stroke="#333333" stroke-width="1" />
    <text x="62" y="265.37" text-anchor="end" dominant-baseline="middle">49</text>
    <line x1="66" y1="190.75" x2="70" y2="190.75" stroke="#333333" stroke-width="1" />
    <text x="62" y="190.75" text-anchor="end" dominant-baseline="middle">99</text>
    <line x1="66" y1="116.12" x2="70" y2="116.12" stroke="#333333" stroke-width="1" />
    <text x="62" y="116.12" text-anchor="end" dominant-baseline="middle">149</text>
    <line x1="66" y1="41.49" x2="70" y2="41.49" stroke="#333333" stroke-width="1" />
    <text x="62" y="41.49" text-anchor="end" dominant-baseline="middle">199</text>
    <line x1="66" y1="40" x2="70" y2="40" stroke="#333333" stroke-width="1" />
    <text x="62" y="40" text-anchor="end" dominant-baseline="middle">200</text>
    <text
      x="22"
      y="190"
      text-anchor="middle"
      dominant-baseline="middle"
      font-weight="bold"
      transform="rotate(-90 22 190)"
