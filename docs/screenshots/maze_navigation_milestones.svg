  </g>
  <g class="right-axis" font-family="sans-serif" font-size="11" fill="#333333">
    <line x1="730" y1="340" x2="734" y2="340" stroke="#333333" stroke-width="1" />
    <text x="738" y="340" text-anchor="start" dominant-baseline="middle">0</text>
    <line x1="730" y1="276.84" x2="734" y2="276.84" stroke="#333333" stroke-width="1" />
    <text x="738" y="276.84" text-anchor="start" dominant-baseline="middle">4</text>
    <line x1="730" y1="213.68" x2="734" y2="213.68" stroke="#333333" stroke-width="1" />
    <text x="738" y="213.68" text-anchor="start" dominant-baseline="middle">8</text>
    <line x1="730" y1="150.53" x2="734" y2="150.53" stroke="#333333" stroke-width="1" />
    <text x="738" y="150.53" text-anchor="start" dominant-baseline="middle">12</text>
    <line x1="730" y1="87.37" x2="734" y2="87.37" stroke="#333333" stroke-width="1" />
    <text x="738" y="87.37" text-anchor="start" dominant-baseline="middle">16</text>
