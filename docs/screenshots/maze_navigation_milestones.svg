    <circle class="best-score-point" cx="70" cy="340" r="2.4" fill="#1f77b4" />
    <circle class="best-score-point" cx="169.34" cy="340" r="2.4" fill="#1f77b4" />
    <circle class="best-score-point" cx="300.66" cy="340" r="2.4" fill="#1f77b4" />
    <circle class="best-score-point" cx="400" cy="340" r="2.4" fill="#1f77b4" />
    <circle class="best-score-point" cx="499.34" cy="340" r="2.4" fill="#1f77b4" />
    <circle class="best-score-point" cx="630.66" cy="340" r="2.4" fill="#1f77b4" />
    <circle class="best-score-point" cx="730" cy="340" r="2.4" fill="#1f77b4" />
  </g>
  <g class="mean-steps-line">
