      fill="none"
      stroke="#ff7f0e"
      stroke-width="1.5"
      points="70,40 169.34,40 300.66,40 400,40 499.34,40 630.66,40 730,40"
    />
    <circle class="mean-steps-point" cx="70" cy="40" r="2.4" fill="#ff7f0e" />
    <circle class="mean-steps-point" cx="169.34" cy="40" r="2.4" fill="#ff7f0e" />
    <circle class="mean-steps-point" cx="300.66" cy="40" r="2.4" fill="#ff7f0e" />
    <circle class="mean-steps-point" cx="400" cy="40" r="2.4" fill="#ff7f0e" />
    <circle class="mean-steps-point" cx="499.34" cy="40" r="2.4" fill="#ff7f0e" />
    <circle class="mean-steps-point" cx="630.66" cy="40" r="2.4" fill="#ff7f0e" />
    <circle class="mean-steps-point" cx="730" cy="40" r="2.4" fill="#ff7f0e" />
  </g>
  <g class="neurons-line">
    <polyline
      fill="none"
      stroke="#2ca02c"
      stroke-width="1.5"
      points="70,197.89 169.34,197.89 300.66,197.89 400,197.89 499.34,197.89 630.66,197.89 730,197.89"
    />
    <circle class="neurons-point" cx="70" cy="197.89" r="2.4" fill="#2ca02c" />
    <circle class="neurons-point" cx="169.34" cy="197.89" r="2.4" fill="#2ca02c" />
    <circle class="neurons-point" cx="300.66" cy="197.89" r="2.4" fill="#2ca02c" />
    <circle class="neurons-point" cx="400" cy="197.89" r="2.4" fill="#2ca02c" />
    <circle class="neurons-point" cx="499.34" cy="197.89" r="2.4" fill="#2ca02c" />
    <circle class="neurons-point" cx="630.66" cy="197.89" r="2.4" fill="#2ca02c" />
    <circle class="neurons-point" cx="730" cy="197.89" r="2.4" fill="#2ca02c" />
  </g>
  <g class="synapses-line">
    <polyline
      fill="none"
      stroke="#d62728"
      stroke-width="1.5"
      points="70,40 169.34,40 300.66,40 400,40 499.34,71.58 630.66,150.53 730,213.68"
    />
    <circle class="synapses-point" cx="70" cy="40" r="2.4" fill="#d62728" />
    <circle class="synapses-point" cx="169.34" cy="40" r="2.4" fill="#d62728" />
    <circle class="synapses-point" cx="300.66" cy="40" r="2.4" fill="#d62728" />
    <circle class="synapses-point" cx="400" cy="40" r="2.4" fill="#d62728" />
    <circle class="synapses-point" cx="499.34" cy="71.58" r="2.4" fill="#d62728" />
    <circle class="synapses-point" cx="630.66" cy="150.53" r="2.4" fill="#d62728" />
    <circle class="synapses-point" cx="730" cy="213.68" r="2.4" fill="#d62728" />
  </g>
  <g class="legend" font-family="sans-serif" font-size="11" fill="#222222">
    <rect
      x="76"
      y="42"
      width="160"
      height="72"
      fill="#ffffff"
      fill-opacity="0.85"
      stroke="#cccccc"
      stroke-width="0.5"
