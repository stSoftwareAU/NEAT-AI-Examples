<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 400"
  width="800"
  height="400"
  role="img"
  aria-label="Mountain Car — multi-run error vs cumulative generations chart"
>
  <title>Mountain Car — multi-run error vs cumulative generations</title>
  <rect width="800" height="400" fill="#fafafa" />
  <text
    x="400"
    y="24"
    text-anchor="middle"
    font-family="sans-serif"
    font-size="16"
    font-weight="bold"
    fill="#222"
  >Mountain Car — multi-run error vs cumulative generations</text>
  <rect x="70" y="50" width="690" height="290" fill="#ffffff" stroke="#333333" stroke-width="1" />
  <g class="x-axis" font-family="sans-serif" font-size="11" fill="#333333">
    <line x1="70" y1="340" x2="70" y2="344" stroke="#333333" stroke-width="1" />
    <text x="70" y="358" text-anchor="middle">1</text>
    <line x1="300" y1="340" x2="300" y2="344" stroke="#333333" stroke-width="1" />
    <text x="300" y="358" text-anchor="middle">10</text>
    <line x1="530" y1="340" x2="530" y2="344" stroke="#333333" stroke-width="1" />
    <text x="530" y="358" text-anchor="middle">100</text>
    <line x1="760" y1="340" x2="760" y2="344" stroke="#333333" stroke-width="1" />
    <text x="760" y="358" text-anchor="middle">1000</text>
    <text
      x="415"
      y="376"
      text-anchor="middle"
      font-weight="bold"
    >cumulative generation (log scale)</text>
  </g>
  <g class="y-axis" font-family="sans-serif" font-size="11" fill="#333333">
    <line x1="66" y1="340" x2="70" y2="340" stroke="#333333" stroke-width="1" />
    <text x="62" y="340" text-anchor="end" dominant-baseline="middle">0</text>
    <line x1="66" y1="282" x2="70" y2="282" stroke="#333333" stroke-width="1" />
    <text x="62" y="282" text-anchor="end" dominant-baseline="middle">0.2</text>
    <line x1="66" y1="224" x2="70" y2="224" stroke="#333333" stroke-width="1" />
    <text x="62" y="224" text-anchor="end" dominant-baseline="middle">0.4</text>
    <line x1="66" y1="166" x2="70" y2="166" stroke="#333333" stroke-width="1" />
    <text x="62" y="166" text-anchor="end" dominant-baseline="middle">0.6</text>
    <line x1="66" y1="108" x2="70" y2="108" stroke="#333333" stroke-width="1" />
    <text x="62" y="108" text-anchor="end" dominant-baseline="middle">0.8</text>
    <line x1="66" y1="50" x2="70" y2="50" stroke="#333333" stroke-width="1" />
    <text x="62" y="50" text-anchor="end" dominant-baseline="middle">1</text>
    <text
      x="22"
      y="195"
      text-anchor="middle"
      dominant-baseline="middle"
      font-weight="bold"
      transform="rotate(-90 22 195)"
    >error</text>
  </g>
  <g class="run-boundaries" font-family="sans-serif" font-size="10" fill="#666666"></g>
  <g class="error-line">
    <polyline
      fill="none"
      stroke="#d62728"
      stroke-width="1.5"
      points="70,50 139.24,50 230.76,50 300,50 369.24,50 460.76,50 530,50 599.24,50 690.76,50 760,50"
    />
    <circle class="error-point" cx="70" cy="50" r="2.4" fill="#d62728" />
    <circle class="error-point" cx="139.24" cy="50" r="2.4" fill="#d62728" />
    <circle class="error-point" cx="230.76" cy="50" r="2.4" fill="#d62728" />
    <circle class="error-point" cx="300" cy="50" r="2.4" fill="#d62728" />
    <circle class="error-point" cx="369.24" cy="50" r="2.4" fill="#d62728" />
    <circle class="error-point" cx="460.76" cy="50" r="2.4" fill="#d62728" />
    <circle class="error-point" cx="530" cy="50" r="2.4" fill="#d62728" />
    <circle class="error-point" cx="599.24" cy="50" r="2.4" fill="#d62728" />
    <circle class="error-point" cx="690.76" cy="50" r="2.4" fill="#d62728" />
    <circle class="error-point" cx="760" cy="50" r="2.4" fill="#d62728" />
  </g>
  <g class="caption" font-family="sans-serif" font-size="12" fill="#222222">
    <text
      x="400"
      y="394"
      text-anchor="middle"
    >final error 1 · 1 runs · 1000 cumulative generations · 155 ms total</text>
  </g>
</svg>
