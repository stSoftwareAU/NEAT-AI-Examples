  <title>Lunar Lander Champion Descent (animated)</title>
  <desc>SMIL-animated SVG: a lander icon descends along the recorded trajectory, tilting with its angle and flickering its main, left, and right thruster flames as the controller fires them. A HUD shows the remaining fuel budget. Loops every 6 seconds.</desc>
