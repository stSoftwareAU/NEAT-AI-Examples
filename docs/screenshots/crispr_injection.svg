<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" role="img" aria-label="CRISPR gene injection — gene topology and before-vs-after milestone summary">
  <title>CRISPR Gene Injection — Topology and Before-vs-After Milestone Summary</title>
  <rect width="880" height="540" fill="#fafafa"/>
