    <line x1="454.00" y1="200.00" x2="808.00" y2="135.00" stroke="#27ae60" stroke-width="3.00" stroke-opacity="0.7"/>
    <circle cx="100.00" cy="70.00" r="14" fill="#4a90d9" stroke="#222" stroke-width="1"/>
