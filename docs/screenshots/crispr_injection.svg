    <circle cx="100.00" cy="200.00" r="14" fill="#4a90d9" stroke="#222" stroke-width="1"/>
    <text x="100.00" y="204.00" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">in[1]</text>
    <circle cx="454.00" cy="70.00" r="14" fill="#bd10e0" stroke="#222" stroke-width="1"/>
    <text x="454.00" y="74.00" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">TANH</text>
    <circle cx="454.00" cy="200.00" r="14" fill="#bd10e0" stroke="#222" stroke-width="1"/>
    <text x="454.00" y="204.00" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">TANH</text>
    <circle cx="808.00" cy="135.00" r="14" fill="#16a085" stroke="#222" stroke-width="1"/>
    <text x="808.00" y="139.00" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">out</text>
